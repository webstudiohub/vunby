<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>VUNBY — Pacotes</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=2"/>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#0F3A8C"/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2"/>
<link rel="stylesheet" href="style.css?v=39"/>
</head><body>
<div id="top"></div>
<div class="container">
  <div class="page-header">
    <h1>Modelos de Pacote</h1>
    <p>Modelos reutilizáveis nos orçamentos</p>
  </div>

  <div class="card">
    <h3>Novo modelo</h3>
    <p class="muted" style="font-size:var(--fs-sm);margin-bottom:var(--sp-4)">Crie uma vez, use em qualquer orçamento. Editar aqui não altera orçamentos já enviados.</p>
    <label>Nome do pacote</label>
    <input id="p-nome" placeholder="Ex: Básico, Completo, Premium"/>
    <label>Itens / descrição</label>
    <textarea id="p-conteudo" rows="2" placeholder="Ex: 2 funcionários, caminhão 3/4, até 50km…"></textarea>
    <label>Preço (R$)</label>
    <input id="p-preco" type="number" step="0.01" min="0" inputmode="decimal"/>
    <label style="display:flex;align-items:center;gap:var(--sp-2);text-transform:none;font-size:var(--fs-md);font-weight:600;color:var(--body);margin-top:var(--sp-4)">
      <input type="checkbox" id="p-destaque" style="width:18px;height:18px;flex-shrink:0;accent-color:var(--navy)"/>
      Marcar como "mais escolhido"
    </label>
    <div style="margin-top:var(--sp-5)">
      <button class="btn-primary" onclick="criarPacote()">Salvar modelo</button>
    </div>
    <div id="msg" class="error"></div>
  </div>

  <div class="card">
    <h3>Meus modelos</h3>
    <div id="lista"></div>
  </div>
</div>
<div id="nav"></div>
<script src="ui.js?v=33"></script>
<script src="app.js?v=40"></script>
<script>
async function criarPacote(){
  const nome=document.getElementById('p-nome').value;
  const conteudo=document.getElementById('p-conteudo').value;
  const preco=document.getElementById('p-preco').value;
  const destaque=document.getElementById('p-destaque').checked;
  const msg=document.getElementById('msg');
  const btn=document.querySelector('.btn-primary');
  msg.textContent='';
  btn.disabled=true; btn.textContent='Salvando…';
  try{
    await api('/api/packages',{method:'POST',body:{nome,conteudo,preco,destaque}});
    document.getElementById('p-nome').value='';
    document.getElementById('p-conteudo').value='';
    document.getElementById('p-preco').value='';
    document.getElementById('p-destaque').checked=false;
    await renderLista();
  }catch(e){msg.textContent=e.message;}
  btn.disabled=false; btn.textContent='Salvar modelo';
}

async function excluir(id){
  if(!(await VUI.confirmar('Orçamentos já enviados não mudam.',{titulo:'Excluir este modelo?',sim:'Excluir',perigo:true,icone:'lixeira'})))return;
  await api('/api/packages/'+id,{method:'DELETE'});
  await renderLista();
}

async function renderLista(){
  const el=document.getElementById('lista');
  el.innerHTML=skeletonRows(2);
  let pacotes;
  try{ pacotes=await api('/api/packages'); }
  catch(e){ el.innerHTML=errorBlock(e.message||'Erro ao carregar.',renderLista); return; }
  if(!pacotes.length){
    el.innerHTML='<p class="muted">Nenhum modelo ainda. Crie o primeiro acima!</p>';
    return;
  }
  el.innerHTML=pacotes.map(p=>`
    <div style="display:flex;align-items:flex-start;justify-content:space-between;padding:var(--sp-4) 0;border-bottom:1px solid var(--gray2)">
      <div style="flex:1;min-width:0">
        <div style="font-weight:700;color:var(--dark);font-size:var(--fs-md)">${esc(p.nome)} ${p.destaque?'<span class="flag-followup">mais escolhido</span>':''}</div>
        ${p.conteudo?`<div class="muted" style="font-size:var(--fs-sm);margin-top:2px">${esc(p.conteudo)}</div>`:''}
        <div style="font-size:var(--fs-lg);font-weight:800;color:var(--navy);margin-top:var(--sp-2)">${brl(p.preco)}</div>
      </div>
      <button onclick="excluir(${p.id})" style="background:none;border:none;color:var(--red);font-size:var(--fs-xl);cursor:pointer;padding:var(--sp-2);margin-left:var(--sp-2);flex-shrink:0" aria-label="Excluir">${ic('lixeira',22)}</button>
    </div>`).join('');
}

(async()=>{
  const session=await requireSession(); if(!session)return;
  document.getElementById('top').innerHTML=topbar('pacotes.html');
  document.getElementById('nav').innerHTML=bottomNav('pacotes.html');
  wireLogout();
  await renderLista();
})();
</script>
</body></html>
