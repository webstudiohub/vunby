<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="robots" content="noindex"/>
<title>VUNBY — Administrador</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=2"/>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#0F3A8C"/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2"/>
<link rel="stylesheet" href="style.css?v=37"/>
</head><body>
<div id="top"></div>
<div class="container" style="margin-bottom:calc(var(--nav-h) + var(--sp-5))">
  <div class="page-header anim"><h1>Administrador</h1><p>Visão geral do VUNBY</p></div>
  <div id="conteudo"><p class="muted">Carregando…</p></div>
</div>
<div id="nav"></div>
<script src="ui.js?v=33"></script>
<script src="app.js?v=36"></script>
<script>
let D = null, aba = 'usuarios';
const dinheiro = n => 'R$ ' + Number(n || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const dt = x => x ? new Date(x).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit' }) : '—';
const dth = x => x ? new Date(x).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—';

function situacao(u) {
  const agora = Date.now();
  const acesso = u.acesso_ate ? new Date(u.acesso_ate).getTime() : 0;
  const trial = u.trial_ate ? new Date(u.trial_ate).getTime() : 0;
  if (u.assinatura_status === 'cortesia') return ['Cortesia', 'ok', 'sem prazo'];
  if (u.assinatura_status === 'ativa') return ['Cartão', 'ok', 'renova ' + dt(u.acesso_ate)];
  if (u.assinatura_status === 'pix') return acesso > agora ? ['Pix', 'ok', 'até ' + dt(u.acesso_ate)] : ['Pix vencido', 'ruim', dt(u.acesso_ate)];
  if (acesso > agora) return ['Liberado', 'ok', 'até ' + dt(u.acesso_ate)];
  if (trial > agora) return ['Teste', 'alerta', 'até ' + dt(u.trial_ate)];
  return ['Sem acesso', 'ruim', 'venceu ' + dt(acesso || trial)];
}
function notaTag(n) { return `<span class="adm-tag ${n >= 9 ? 'adm-tag-ok' : n >= 7 ? 'adm-tag-alerta' : 'adm-tag-ruim'}">${n}/10</span>`; }

function numeros() {
  const n = D.numeros;
  const c = (rot, val, sub) => `<div class="stat-card"><div class="stat-label">${rot}</div><div class="stat-value">${val}</div>${sub ? `<small class="muted">${sub}</small>` : ''}</div>`;
  return `<div class="adm-num">
    ${c('Usuários', n.total, '+' + n.novos_7d + ' em 7 dias')}
    ${c('Pagantes', n.cartao + n.pix, n.cartao + ' cartão · ' + n.pix + ' Pix')}
    ${c('Em teste', n.em_teste, n.vencidos + ' sem acesso')}
    ${c('Receita/mês', dinheiro(n.receita_mensal), n.vencendo ? n.vencendo + ' Pix vencendo' : '')}
    ${c('Orçamentos', n.orcamentos, '+' + n.orcamentos_7d + ' em 7 dias')}
    ${c('Notificações', n.aparelhos_push, 'aparelhos')}
    ${c('Cortesias', n.cortesia, '')}
  </div>`;
}

function listaUsuarios() {
  return `<div class="adm-lista">` + D.usuarios.map(u => {
    const [rot, cor, det] = situacao(u);
    return `<div class="adm-item">
      <div class="adm-item-topo"><div><strong>${esc(u.nome)}</strong>${u.fundador ? ' ⭐' : ''}<small>${esc(u.email)}</small>${u.nome_empresa ? `<small>${esc(u.nome_empresa)}</small>` : ''}</div>
      <span class="adm-tag adm-tag-${cor}">${rot}</span></div>
      <small style="margin-top:6px">${det} · ${u.orcamentos} orçamento(s) · cadastro ${dt(u.created_at)}${u.preco ? ' · ' + dinheiro(u.preco) : ''}</small>
      <div class="adm-acoes">
        <button class="btn-outline btn-sm" onclick="darDias(${u.id},7)">+7 dias</button>
        <button class="btn-outline btn-sm" onclick="darDias(${u.id},30)">+30 dias</button>
        ${u.assinatura_status === 'cortesia'
          ? `<button class="btn-outline btn-sm" onclick="cortesia(${u.id},false)">Tirar cortesia</button>`
          : u.assinatura_status !== 'ativa' ? `<button class="btn-outline btn-sm" onclick="cortesia(${u.id},true)">Dar cortesia</button>` : ''}
      </div></div>`;
  }).join('') + `</div>`;
}

function listaOpinioes() {
  const f = D.feedbacks.map(x => `<div class="adm-item"><div class="adm-item-topo"><div><strong>${esc(x.nome)}</strong><small>${esc(x.email)} · ${dth(x.created_at)}</small></div>${notaTag(x.nota)}</div>
    ${[['Experiência', x.experiencia], ['Está gostando', x.gostando], ['Melhorar', x.melhorar], ['Não gostou', x.nao_gostou], ['Falta', x.falta], ['Preço', x.comentario_preco]].filter(p => p[1]).map(p => `<p style="margin-top:6px"><small>${p[0]}</small>${esc(p[1])}</p>`).join('')}
    <p style="margin-top:6px"><small>Pagaria R$ 49,90?</small><strong>${esc(x.pagaria_4990)}</strong></p></div>`).join('');
  const p = D.pulsos.map(x => `<div class="adm-item"><div class="adm-item-topo"><div><strong>${esc(x.nome)}</strong><small>${esc(x.email)} · ${dth(x.created_at)}</small></div>${notaTag(x.nota)}</div>${x.comentario ? `<p style="margin-top:6px">${esc(x.comentario)}</p>` : ''}</div>`).join('');
  return `<h3 style="margin-bottom:8px">Pesquisa completa (dia 20)</h3><div class="adm-lista">${f || '<p class="muted">Nenhuma ainda.</p>'}</div>
    <h3 style="margin:18px 0 8px">Nota rápida (a cada 90 dias)</h3><div class="adm-lista">${p || '<p class="muted">Nenhuma ainda.</p>'}</div>`;
}

function listaSugestoes() {
  return `<div class="adm-lista">` + (D.sugestoes.map(x => `<div class="adm-item"><div class="adm-item-topo"><div><strong>${esc(x.nome)}</strong><small>${esc(x.email)} · ${dth(x.created_at)}</small></div><span class="adm-tag">${esc(x.tipo)}</span></div><p style="margin-top:6px;white-space:pre-wrap">${esc(x.mensagem)}</p></div>`).join('') || '<p class="muted">Nenhuma ainda.</p>') + `</div>`;
}

function listaPix() {
  return `<div class="adm-lista">` + (D.pix.map(x => `<div class="adm-item"><div class="adm-item-topo"><div><strong>${esc(x.nome)}</strong><small>${esc(x.email)} · ${dth(x.criado_em)}</small></div><span class="adm-tag ${x.status === 'approved' ? 'adm-tag-ok' : ''}">${dinheiro(x.valor)} · ${x.status === 'approved' ? 'pago' : esc(x.status)}</span></div></div>`).join('') || '<p class="muted">Nenhum Pix ainda.</p>') + `</div>`;
}

function listaIndicacoes() {
  const pend = (D.mesesPendentes || []).map(u => `<div class="adm-item"><div class="adm-item-topo"><div><strong>${esc(u.nome)}</strong><small>${esc(u.email)} · paga no cartão</small></div><span class="adm-tag adm-tag-alerta">${u.meses} mês(es) a abater</span></div>
    <div class="adm-acoes"><button class="btn-outline btn-sm" onclick="mesAbatido(${u.id})">Já abati 1 mês</button></div></div>`).join('');
  const linhas = (D.indicacoes || []).map(x => `<div class="adm-item"><div class="adm-item-topo"><div><strong>${esc(x.dono)}</strong><small>vunby.com.br/?ref=${esc(x.codigo)} · ${x.tipo === 'parceiro' ? 'parceiro' : 'usuário'}</small></div>
    <span class="adm-tag ${x.pagantes ? 'adm-tag-ok' : ''}">${x.pagantes} pagante(s)</span></div>
    <small style="margin-top:6px">${x.visitas} visita(s) · ${x.cadastros} cadastro(s) · ${x.pagantes} assinaram</small></div>`).join('');
  return (pend ? `<h3 style="margin-bottom:8px">Meses grátis para abater (cartão)</h3><div class="adm-lista" style="margin-bottom:18px">${pend}</div>` : '') +
    `<h3 style="margin-bottom:8px">Links de indicação</h3><div class="adm-lista">${linhas || '<p class="muted">Nenhuma indicação ainda.</p>'}</div>
    <div class="adm-item" style="margin-top:14px"><strong>Novo link de parceiro</strong>
      <div style="display:grid;gap:8px;margin-top:8px">
        <input id="p-nome" maxlength="80" placeholder="Nome (ex.: Mello's Transportes)"/>
        <input id="p-cod" maxlength="24" placeholder="Código (ex.: mellos)" autocapitalize="off"/>
        <button class="btn-primary btn-gold" onclick="criarParceiro()">Criar link</button>
      </div></div>`;
}
async function criarParceiro() {
  const nome = document.getElementById('p-nome').value, codigo = document.getElementById('p-cod').value;
  try { await api('/api/admin/parceiro', { method: 'POST', body: { nome, codigo } }); VUI.toast('Link criado: vunby.com.br/?ref=' + codigo.trim().toLowerCase(), 'ok'); carregar(); } catch (e) { VUI.toast(e.message, 'erro'); }
}
async function mesAbatido(id) {
  if (!(await VUI.confirmar('Confirma que já descontou 1 mês da assinatura deste usuário no Mercado Pago?', { titulo: 'Mês abatido', sim: 'Confirmar', nao: 'Cancelar' }))) return;
  try { await api('/api/admin/mes-abatido', { method: 'POST', body: { userId: id } }); VUI.toast('Feito', 'ok'); carregar(); } catch (e) { VUI.toast(e.message, 'erro'); }
}

function listaSite() {
  const S = D.site || { dias: [], origens: [] };
  const soma = (arr, k) => arr.reduce((a, x) => a + (x[k] || 0), 0);
  const d30 = S.dias, d7 = S.dias.slice(-7);
  const pct = (a, b) => b ? (Math.round(a * 1000 / b) / 10).toLocaleString('pt-BR') + '%' : '—';
  const bloco = (rot, arr) => {
    const v = soma(arr, 'visitantes'), c = soma(arr, 'abriu_cadastro'), k = soma(arr, 'contas');
    return `<div class="adm-item"><strong>${rot}</strong>
      <div class="adm-num" style="margin:10px 0 0">
        <div class="stat-card"><div class="stat-label">Visitantes</div><div class="stat-value">${v}</div></div>
        <div class="stat-card"><div class="stat-label">Abriram o cadastro</div><div class="stat-value">${c}</div><small class="muted">${pct(c, v)} dos visitantes</small></div>
        <div class="stat-card"><div class="stat-label">Criaram conta</div><div class="stat-value">${k}</div><small class="muted">${pct(k, v)} dos visitantes</small></div>
      </div></div>`;
  };
  const max = Math.max(1, ...d30.map(x => x.visitantes));
  const barras = d30.slice(-14).map(x => `<div style="display:grid;grid-template-columns:46px 1fr auto;gap:8px;align-items:center;font-size:13px">
      <span class="muted">${new Date(x.dia + 'T12:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' })}</span>
      <span style="height:10px;border-radius:6px;background:var(--navy);width:${Math.max(2, x.visitantes * 100 / max)}%"></span>
      <span style="white-space:nowrap">${x.visitantes} · ${x.contas} conta${x.contas === 1 ? '' : 's'}</span></div>`).join('');
  const orig = S.origens.map(o => `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--gray2)"><span>${esc(o.origem)}</span><strong>${o.visitantes}</strong></div>`).join('');
  return `<div class="adm-lista">${bloco('Últimos 7 dias', d7)}${bloco('Últimos 30 dias', d30)}
    <div class="adm-item"><strong>Visitantes por dia (14 dias)</strong><div style="display:grid;gap:6px;margin-top:10px">${barras}</div></div>
    <div class="adm-item"><strong>De onde vieram (30 dias)</strong><div style="margin-top:6px">${orig || '<p class="muted">Ainda sem visitas.</p>'}</div>
    <small style="margin-top:8px">Sem cookies: cada pessoa conta 1 vez por dia. Sua própria visita também conta.</small></div></div>`;
}

function desenhar() {
  const abas = [['usuarios', 'Usuários'], ['opinioes', 'Opiniões'], ['sugestoes', 'Sugestões'], ['pix', 'Pix'], ['indicacoes', 'Indicações'], ['site', 'Site']];
  const corpo = { usuarios: listaUsuarios, opinioes: listaOpinioes, sugestoes: listaSugestoes, pix: listaPix, indicacoes: listaIndicacoes, site: listaSite }[aba]();
  document.getElementById('conteudo').innerHTML = numeros() +
    `<div class="adm-abas">${abas.map(([k, r]) => `<button class="${k === aba ? 'on' : ''}" onclick="aba='${k}';desenhar()">${r}</button>`).join('')}</div>` + corpo;
}

async function carregar() {
  try { D = await api('/api/admin/resumo'); desenhar(); }
  catch (e) { document.getElementById('conteudo').innerHTML = `<div class="card"><p>${esc(e.message || 'Acesso negado.')}</p></div>`; }
}
async function darDias(id, dias) {
  if (!(await VUI.confirmar('Liberar +' + dias + ' dias de acesso para este usuário?', { titulo: 'Liberar acesso', sim: 'Liberar', nao: 'Cancelar' }))) return;
  try { await api('/api/admin/acesso', { method: 'POST', body: { userId: id, dias } }); VUI.toast('Acesso liberado', 'ok'); carregar(); } catch (e) { VUI.toast(e.message, 'erro'); }
}
async function cortesia(id, ativo) {
  if (!(await VUI.confirmar(ativo ? 'Acesso grátis e sem prazo.' : 'O usuário volta ao estado sem assinatura.', { titulo: ativo ? 'Dar cortesia?' : 'Tirar cortesia?', sim: 'Confirmar', nao: 'Cancelar' }))) return;
  try { await api('/api/admin/cortesia', { method: 'POST', body: { userId: id, ativo } }); VUI.toast('Feito', 'ok'); carregar(); } catch (e) { VUI.toast(e.message, 'erro'); }
}
(async () => {
  const s = await requireSession(); if (!s) return;
  document.getElementById('top').innerHTML = topbar('');
  document.getElementById('nav').innerHTML = bottomNav('');
  wireLogout();
  carregar();
})();
</script>
</body></html>
