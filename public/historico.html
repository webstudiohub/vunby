<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>VUNBY — Histórico</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#0F3A8C"/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
<link rel="stylesheet" href="style.css"/>
</head><body>
<div id="top"></div>
<div class="container">
  <div class="page-header">
    <h1>Histórico</h1>
    <p>Todos os seus orçamentos</p>
  </div>

  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input id="busca" type="search" placeholder="Buscar por cliente ou serviço…" oninput="filtrar()" autocomplete="off"/>
  </div>

  <div class="filter-row" id="filtro-row">
    <button class="filter-chip active" data-v="" onclick="setFiltro(this,'')">Todos</button>
    <button class="filter-chip" data-v="Enviado" onclick="setFiltro(this,'Enviado')">Enviado</button>
    <button class="filter-chip" data-v="Visualizado" onclick="setFiltro(this,'Visualizado')">Visualizado</button>
    <button class="filter-chip" data-v="Sem resposta" onclick="setFiltro(this,'Sem resposta')">Sem resposta</button>
    <button class="filter-chip" data-v="Aprovado" onclick="setFiltro(this,'Aprovado')">Aprovado</button>
    <button class="filter-chip" data-v="Recusado" onclick="setFiltro(this,'Recusado')">Recusado</button>
  </div>

  <div class="card" style="padding-top:var(--sp-3)">
    <div id="lista"></div>
  </div>
</div>
<div id="nav"></div>
<script src="app.js"></script>
<script>
let todos=[], filtroStatus='';

function setFiltro(el, val){
  filtroStatus=val;
  document.querySelectorAll('#filtro-row .filter-chip').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  filtrar();
}

function filtrar(){
  const q=(document.getElementById('busca').value||'').toLowerCase().trim();
  let items=todos;
  if(filtroStatus) items=items.filter(x=>x.status===filtroStatus);
  if(q) items=items.filter(x=>
    (x.cliente_nome||'').toLowerCase().includes(q)||
    (x.servico||'').toLowerCase().includes(q)
  );
  const el=document.getElementById('lista');
  if(!items.length){
    el.innerHTML='<p class="muted">Nenhum orçamento encontrado.</p>';
    return;
  }
  el.innerHTML=items.map(q=>`
    <a href="orcamento-detalhe.html?id=${q.id}" class="quote-row">
      <div class="quote-row-left">
        <div class="quote-row-title">${esc(q.servico)}${q.precisa_follow_up?'<span class="flag-followup">follow-up</span>':''}</div>
        <div class="quote-row-meta">${esc(q.cliente_nome)} · ${relDate(q.created_at)}</div>
      </div>
      <div class="quote-row-right">
        <div class="quote-row-valor">${brl(q.valor)}</div>
        <span class="${badgeClass(q.status)}">${q.status}</span>
      </div>
    </a>`).join('');
}

(async()=>{
  const session=await requireSession(); if(!session)return;
  document.getElementById('top').innerHTML=topbar('historico.html');
  document.getElementById('nav').innerHTML=bottomNav('historico.html');
  wireLogout();
  const el=document.getElementById('lista');
  el.innerHTML=skeletonRows(4);
  try{
    todos=await api('/api/quotes');
    filtrar();
  }catch(e){
    el.innerHTML=errorBlock(e.message||'Erro ao carregar.', async()=>{ el.innerHTML=skeletonRows(4); try{todos=await api('/api/quotes');filtrar();}catch(e2){el.innerHTML=errorBlock(e2.message,()=>{});} });
  }
})();
</script>
</body></html>
