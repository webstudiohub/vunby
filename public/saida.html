<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>VUNBY — Conta pra gente</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=2"/>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#0F3A8C"/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2"/>
<link rel="stylesheet" href="style.css?v=54"/>
</head><body>
<div id="top"></div>
<div class="container" style="margin-bottom:calc(var(--nav-h) + var(--sp-5))">
  <div class="page-header anim">
    <h1 id="titulo">Por que você está saindo?</h1>
    <p>30 segundos. Sua resposta vai direto para o fundador do VUNBY e vira melhoria.</p>
  </div>

  <div class="card anim anim-1" id="form">
    <label style="margin-top:0">Qual o principal motivo?</label>
    <div class="motivos" id="motivos">
      <button type="button" data-v="caro">Achei caro</button>
      <button type="button" data-v="pouco_uso">Usei pouco / não tive tempo</button>
      <button type="button" data-v="dificil">Achei difícil de usar</button>
      <button type="button" data-v="faltou">Faltou algo que eu precisava</button>
      <button type="button" data-v="problema">Tive problema técnico</button>
      <button type="button" data-v="outro_app">Vou usar outro app</button>
      <button type="button" data-v="parei">Parei de trabalhar / mudei de área</button>
      <button type="button" data-v="outro">Outro motivo</button>
    </div>

    <label id="lbl-com">Quer contar mais? (opcional)</label>
    <textarea id="comentario" rows="3" maxlength="2000" placeholder="Ex.: senti falta de…"></textarea>

    <label class="avisar"><input type="checkbox" id="avisar" checked/> Me avise quando o VUNBY melhorar nesse ponto</label>

    <p id="msg" style="color:#B45309;font-size:var(--fs-sm);margin:10px 0 0"></p>
    <button class="btn-primary" id="btn-enviar" style="margin-top:var(--sp-3)">Enviar</button>
    <a href="dashboard.html" class="muted" style="display:block;text-align:center;margin-top:12px;font-size:var(--fs-sm)">Pular</a>
  </div>
</div>
<div id="nav"></div>
<script src="ui.js?v=54"></script>
<script src="app.js?v=54"></script>
<script>
const tipo=['cancelou','nao_assinou','nao_renovou'].includes(new URLSearchParams(location.search).get('tipo'))?new URLSearchParams(location.search).get('tipo'):'cancelou';
if(tipo==='nao_assinou') document.getElementById('titulo').textContent='Por que você não vai assinar?';
if(tipo==='nao_renovou') document.getElementById('titulo').textContent='Por que você não vai continuar?';
const DICA={caro:'Quanto seria um valor justo para você?',faltou:'O que faltou? Quanto mais detalhe, melhor.',dificil:'Em qual parte você travou?',problema:'O que aconteceu? Em qual tela?',outro_app:'Qual app? O que ele tem que o VUNBY não tem?'};
let motivo=null;
document.querySelectorAll('#motivos button').forEach(b=>b.onclick=()=>{
  motivo=b.dataset.v; document.querySelectorAll('#motivos button').forEach(x=>x.classList.toggle('sel',x===b));
  document.getElementById('lbl-com').textContent=DICA[motivo]?DICA[motivo]+' (opcional)':'Quer contar mais? (opcional)';
});
document.getElementById('btn-enviar').onclick=async()=>{
  const msg=document.getElementById('msg'), btn=document.getElementById('btn-enviar');
  msg.textContent='';
  if(!motivo){msg.textContent='Escolha um motivo.';return;}
  btn.disabled=true; btn.textContent='Enviando…';
  try{
    await api('/api/feedback/saida',{method:'POST',body:{tipo,motivo,comentario:document.getElementById('comentario').value,avisar:document.getElementById('avisar').checked}});
    document.getElementById('form').innerHTML='<h3>Obrigado pela sinceridade!</h3><p class="muted">Lemos cada resposta. Se você pediu, avisamos quando melhorarmos esse ponto. As portas continuam abertas.</p><a href="dashboard.html"><button class="btn-primary" style="margin-top:var(--sp-4)">Voltar ao início</button></a>';
  }catch(e){msg.textContent=e.message; btn.disabled=false; btn.textContent='Enviar';}
};
(async()=>{
  const session=await requireSession(); if(!session)return;
  document.getElementById('top').innerHTML=topbar('');
  document.getElementById('nav').innerHTML=bottomNav('');
  wireLogout();
})();
</script>
<style>
.motivos{display:grid;gap:8px;margin-top:8px}
.motivos button{min-height:48px;border:1.5px solid var(--gray2);background:#fff;border-radius:12px;font-weight:600;color:var(--dark);cursor:pointer;text-align:left;padding:10px 14px;font-size:var(--fs-md);font-family:inherit}
.motivos button.sel{background:var(--navy);border-color:var(--navy);color:#fff}
.avisar{display:flex;gap:10px;align-items:center;font-weight:500;margin-top:14px}
.avisar input{-webkit-appearance:checkbox;appearance:auto;width:22px;height:22px;min-height:0;padding:0;margin:0;flex-shrink:0;accent-color:#0F3A8C}
</style>
</body></html>
