<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1"/>
<title>VUNBY — Novo Orçamento</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#003D6B"/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
<link rel="stylesheet" href="style.css"/>
</head><body>
<div id="top"></div>
<div class="container">
  <div class="page-header">
    <h1>Novo Orçamento</h1>
    <p>Preencha os dados e envie pelo WhatsApp</p>
  </div>

  <div id="aviso-plano"></div>

  <div id="aviso-rascunho" class="card" style="display:none;background:#EEF4FA;border:1.5px solid #003D6B">
    <p style="font-size:14px;margin:0"><strong>Rascunho recuperado.</strong> Continuamos de onde você parou.</p>
    <button class="btn-outline btn-sm" style="margin-top:8px" onclick="descartarRascunho()">Descartar e começar do zero</button>
  </div>

  <div class="card">
    <label>Cliente</label>
    <select id="q-client">
      <option value="">Selecione um cliente…</option>
    </select>

    <details id="novo-cliente-details" style="margin-top:var(--sp-3)">
      <summary style="font-size:14px;color:var(--navy);cursor:pointer;font-weight:600;user-select:none">+ Novo cliente</summary>
      <div style="margin-top:var(--sp-4);padding:var(--sp-4);background:var(--gray);border-radius:var(--radius-sm)">
        <label style="margin-top:0">Nome</label>
        <input id="nc-nome" placeholder="Nome do cliente"/>
        <label>Telefone (WhatsApp)</label>
        <input id="nc-tel" type="tel" placeholder="+55 11 99999-9999"/>
        <div style="margin-top:var(--sp-4)">
          <button class="btn-outline btn-sm" onclick="criarCliente()">Salvar cliente</button>
        </div>
        <div id="nc-msg" class="error"></div>
      </div>
    </details>
  </div>

  <div class="card">
    <h3>Detalhes do serviço</h3>
    <label style="margin-top:0">Serviço / descrição</label>
    <input id="q-servico" placeholder="Ex: Mudança residencial — 2 quartos"/>
    <label>Valor (R$)</label>
    <input id="q-valor" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0,00"/>
    <label>Validade</label>
    <input id="q-validade" type="date"/>
    <label>Observações (opcional)</label>
    <textarea id="q-obs" rows="2" placeholder="Algum detalhe extra para o cliente…"></textarea>
  </div>

  <div class="card" id="card-pacotes" style="display:none">
    <h3>Incluir pacote (opcional)</h3>
    <div id="pacotes-lista" class="grid-2"></div>
  </div>

  <div class="card">
    <label style="display:flex;align-items:center;gap:var(--sp-3);text-transform:none;font-size:15px;font-weight:600;color:var(--body);margin-top:0;cursor:pointer">
      <input type="checkbox" id="q-followup" style="width:18px;height:18px;flex-shrink:0;accent-color:var(--navy)"/>
      Marcar para follow-up
    </label>
    <p class="muted" style="font-size:13px;margin-top:var(--sp-2)">Aparecerá em destaque no Radar</p>
  </div>

  <div class="card-acao" style="margin-bottom:var(--sp-6)">
    <button class="btn-primary btn-gold" onclick="criarOrcamento()">Criar e abrir WhatsApp</button>
    <div id="q-msg" class="error"></div>
  </div>
</div>
<div id="nav"></div>
<script src="app.js"></script>
<script>
let clientes=[], pacotes=[];
const selectedPkgs=new Set();

// ─── Rascunho automático (fica no próprio aparelho; some ao criar o orçamento) ───
let RASCUNHO_KEY='vunby:rascunho';
let criado=false; // depois de criar o orçamento, não salva mais rascunho
const CAMPOS=['q-client','q-servico','q-valor','q-validade','q-obs'];
function salvarRascunho(){
  if(criado) return;
  try{
    const d={pkgs:[...selectedPkgs],followup:document.getElementById('q-followup').checked,ts:Date.now()};
    CAMPOS.forEach(id=>d[id]=document.getElementById(id).value);
    const vazio=!d['q-servico']&&!d['q-valor']&&!d['q-obs']&&!d['q-client'];
    if(vazio) localStorage.removeItem(RASCUNHO_KEY); else localStorage.setItem(RASCUNHO_KEY,JSON.stringify(d));
  }catch{}
}
function carregarRascunho(){
  try{
    const d=JSON.parse(localStorage.getItem(RASCUNHO_KEY)||'null');
    if(!d) return;
    if(Date.now()-(d.ts||0)>30*24*3600*1000){ localStorage.removeItem(RASCUNHO_KEY); return; }
    CAMPOS.forEach(id=>{ if(d[id]!==undefined&&d[id]!=='') document.getElementById(id).value=d[id]; });
    document.getElementById('q-followup').checked=!!d.followup;
    (d.pkgs||[]).forEach(id=>{ if(pacotes.some(p=>String(p.id)===String(id))){ selectedPkgs.add(id); const cb=document.querySelector(`input[data-id="${id}"]`); if(cb) cb.checked=true; } });
    document.getElementById('aviso-rascunho').style.display='';
  }catch{}
}
function limparRascunho(){ try{ localStorage.removeItem(RASCUNHO_KEY); }catch{} }
function descartarRascunho(){
  limparRascunho();
  ['q-client','q-servico','q-valor','q-obs'].forEach(id=>document.getElementById(id).value='');
  const d=new Date(); d.setDate(d.getDate()+7);
  document.getElementById('q-validade').value=d.toISOString().split('T')[0];
  document.getElementById('q-followup').checked=false;
  selectedPkgs.clear(); document.querySelectorAll('#pacotes-lista input').forEach(cb=>cb.checked=false);
  document.getElementById('aviso-rascunho').style.display='none';
}

async function criarCliente(){
  const nome=document.getElementById('nc-nome').value;
  const telefone=document.getElementById('nc-tel').value;
  const msg=document.getElementById('nc-msg');
  const btn=document.querySelector('#novo-cliente-details .btn-outline');
  msg.textContent='';
  btn.disabled=true; btn.textContent='Salvando…';
  try{
    const c=await api('/api/clients',{method:'POST',body:{nome,telefone}});
    clientes.push(c);
    const sel=document.getElementById('q-client');
    const opt=document.createElement('option');
    opt.value=String(c.id);
    opt.textContent=`${c.nome} — ${c.telefone}`;
    sel.appendChild(opt);
    sel.value=String(c.id);
    salvarRascunho();
    document.getElementById('novo-cliente-details').removeAttribute('open');
  }catch(e){msg.textContent=e.message;}
  btn.disabled=false; btn.textContent='Salvar cliente';
}

function renderPacotes(){
  const el=document.getElementById('pacotes-lista');
  const card=document.getElementById('card-pacotes');
  if(!pacotes.length){ card.style.display='none'; return; }
  card.style.display='';
  el.innerHTML=pacotes.map(p=>`
    <label class="pkg-select-card">
      <input type="checkbox" data-id="${p.id}" onchange="togglePkg(${p.id})"/>
      <div class="pkg-select-info">
        <strong>${esc(p.nome)}</strong>
        <span>${brl(p.preco)}${p.conteudo?' · '+esc(p.conteudo.substring(0,40)):''}</span>
      </div>
    </label>`).join('');
}

function togglePkg(id){
  if(selectedPkgs.has(id)) selectedPkgs.delete(id);
  else selectedPkgs.add(id);
  salvarRascunho();
}

async function criarOrcamento(){
  const clientId=document.getElementById('q-client').value;
  const servico=document.getElementById('q-servico').value;
  const valor=document.getElementById('q-valor').value;
  const validade=document.getElementById('q-validade').value;
  const observacoes=document.getElementById('q-obs').value;
  const precisaFollowUp=document.getElementById('q-followup').checked;
  const msg=document.getElementById('q-msg');
  const btn=document.querySelector('[onclick="criarOrcamento()"]');
  msg.textContent='';
  if(!clientId){msg.textContent='Selecione ou crie um cliente.';return;}
  if(!servico){msg.textContent='Descreva o serviço.';return;}
  btn.disabled=true; btn.textContent='Criando…';
  try{
    const r=await api('/api/quotes',{method:'POST',body:{clientId:parseInt(clientId),servico,valor,validade,observacoes,pacoteIds:[...selectedPkgs],precisaFollowUp}});
    criado=true; limparRascunho();
    window.open(r.whatsappLink,'_blank');
    location.href='orcamento-detalhe.html?id='+r.id;
  }catch(e){msg.textContent=e.message; btn.disabled=false; btn.textContent='Criar e abrir WhatsApp';}
}

(async()=>{
  const session=await requireSession(); if(!session)return;
  document.getElementById('top').innerHTML=topbar('');
  document.getElementById('nav').innerHTML=bottomNav('novo-orcamento.html');
  wireLogout();
  // Teste grátis terminou: mostra só o aviso (o servidor também bloqueia a criação)
  api('/api/billing/status').then(st=>{
    if(st.tipo!=='expirado')return;
    document.body.classList.add('plano-bloqueado');
    document.getElementById('aviso-plano').innerHTML=avisoPlano({tipo:'expirado'});
  }).catch(()=>{});
  [clientes,pacotes]=await Promise.all([api('/api/clients'),api('/api/packages')]);
  const sel=document.getElementById('q-client');
  clientes.forEach(c=>{
    const opt=document.createElement('option');
    opt.value=String(c.id);
    opt.textContent=`${c.nome} — ${c.telefone}`;
    sel.appendChild(opt);
  });
  const d=new Date(); d.setDate(d.getDate()+7);
  document.getElementById('q-validade').value=d.toISOString().split('T')[0];
  renderPacotes();
  RASCUNHO_KEY='vunby:rascunho:'+session.id;
  carregarRascunho();
  CAMPOS.forEach(id=>{ const el=document.getElementById(id); el.addEventListener('input',salvarRascunho); el.addEventListener('change',salvarRascunho); });
  document.getElementById('q-followup').addEventListener('change',salvarRascunho);
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') salvarRascunho(); });
})();
</script>
</body></html>
