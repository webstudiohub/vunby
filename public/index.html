<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>VUNBY — Entrar</title>
<link rel="manifest" href="manifest.json"/><meta name="theme-color" content="#003D6B"/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
<link rel="stylesheet" href="style.css"/>
</head><body>
<div class="auth-container">
  <div class="auth-logo">VUN<span>BY</span></div>
  <div class="auth-toggle">
    <button id="btn-tab-login" class="active" onclick="showTab('login')">Entrar</button>
    <button id="btn-tab-register" onclick="showTab('register')">Criar conta</button>
  </div>

  <!-- LOGIN -->
  <div id="tab-login" class="card">
    <label>E-mail</label><input id="l-email" type="email" autocomplete="email" placeholder="seu@email.com"/>
    <label>Senha</label><input id="l-senha" type="password" autocomplete="current-password"/>
    <div style="margin-top:18px;"><button class="btn-primary" onclick="login()">Entrar</button></div>
    <div id="l-msg" class="error"></div>
    <p class="muted mt text-center"><a href="/esqueci-senha.html">Esqueci minha senha</a></p>
  </div>

  <!-- CADASTRO -->
  <div id="tab-register" class="card" style="display:none">
    <label>Nome</label><input id="r-nome" autocomplete="name" placeholder="Seu nome ou empresa"/>
    <label>E-mail</label><input id="r-email" type="email" autocomplete="email"/>
    <label>Telefone (WhatsApp)</label><input id="r-tel" type="tel" autocomplete="tel" placeholder="+55 11 99999-9999"/>
    <label>Senha (mín. 8 caracteres)</label><input id="r-senha" type="password" autocomplete="new-password"/>
    <div style="margin-top:18px;"><button class="btn-primary" onclick="register()">Criar conta</button></div>
    <div id="r-msg" class="error"></div>
  </div>

  <p class="muted text-center mt"><a href="/">← Início</a></p>
</div>
<script>
function showTab(t){
  document.getElementById('tab-login').style.display = t==='login'?'':'none';
  document.getElementById('tab-register').style.display = t==='register'?'':'none';
  document.getElementById('btn-tab-login').className = t==='login'?'active':'';
  document.getElementById('btn-tab-register').className = t==='register'?'active':'';
}
// Auto-switch para /cadastro
if(location.pathname==='/cadastro') showTab('register');

async function login(){
  const email=document.getElementById('l-email').value;
  const senha=document.getElementById('l-senha').value;
  const msg=document.getElementById('l-msg');
  msg.textContent='';
  try{
    const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,senha}),credentials:'same-origin'});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||'Erro');
    if(d.telefoneVerificado===false){location.href='/verificar-email.html?email='+encodeURIComponent(email);return;}
    location.href='/dashboard.html';
  }catch(e){msg.textContent=e.message;}
}

async function register(){
  const nome=document.getElementById('r-nome').value;
  const email=document.getElementById('r-email').value;
  const telefone=document.getElementById('r-tel').value;
  const senha=document.getElementById('r-senha').value;
  const msg=document.getElementById('r-msg');
  msg.textContent='';
  try{
    const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nome,email,telefone,senha})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||'Erro');
    location.href='/verificar-email.html?email='+encodeURIComponent(email);
  }catch(e){msg.textContent=e.message;}
}
</script>
</body></html>
