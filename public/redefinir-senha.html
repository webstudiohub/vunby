<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>VUNBY — Redefinir senha</title>
<link rel="stylesheet" href="style.css"/>
</head><body>
<div class="auth-container">
  <div class="auth-logo">VUN<span>BY</span></div>
  <div class="card">
    <h2>Nova senha</h2>
    <label>Nova senha (mín. 8 caracteres)</label><input id="senha" type="password"/>
    <label>Confirmar senha</label><input id="senha2" type="password"/>
    <div style="margin-top:18px;"><button class="btn-primary" onclick="redefinir()">Salvar nova senha</button></div>
    <div id="msg" class="error"></div>
    <div id="ok" class="success" style="display:none">Senha redefinida! <a href="/entrar">Entrar</a></div>
  </div>
</div>
<script>
const token=new URLSearchParams(location.search).get('token')||'';
async function redefinir(){
  const senha=document.getElementById('senha').value;
  const senha2=document.getElementById('senha2').value;
  const msg=document.getElementById('msg');
  msg.textContent='';
  if(senha!==senha2){msg.textContent='As senhas não coincidem.';return;}
  try{
    const r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,senha})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||'Erro');
    document.getElementById('ok').style.display='block';
  }catch(e){msg.textContent=e.message;}
}
</script>
</body></html>
