<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>VUNBY — Radar</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=2"/>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#0F3A8C"/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2"/>
<link rel="stylesheet" href="style.css?v=33"/>
</head><body>
<div id="top"></div>
<div class="container">
  <div class="page-header anim">
    <h1>Radar de Vendas</h1>
    <p>Orçamentos aguardando resposta</p>
  </div>

  <div class="hero-card anim anim-1">
    <div class="hero-card-label">Valor total em aberto</div>
    <div id="valor-aberto" class="hero-card-value">—</div>
    <div id="total-aberto" class="hero-card-sub">carregando…</div>
  </div>

  <div class="filter-row" id="filtro-row">
    <button class="filter-chip active" data-v="" onclick="setFiltro(this,'')">Todos</button>
    <button class="filter-chip" data-v="Enviado" onclick="setFiltro(this,'Enviado')">Enviado</button>
    <button class="filter-chip" data-v="Visualizado" onclick="setFiltro(this,'Visualizado')">Visualizado</button>
    <button class="filter-chip" data-v="Sem resposta" onclick="setFiltro(this,'Sem resposta')">Sem resposta</button>
  </div>

  <div class="card" style="padding-top:var(--sp-3)">
    <div id="lista"></div>
  </div>
</div>
<div id="nav"></div>
<script src="ui.js?v=33"></script>
<script src="app.js?v=35"></script>
<script>
let data=[], filtroAtual='';

function setFiltro(el, val){
  filtroAtual=val;
  document.querySelectorAll('#filtro-row .filter-chip').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  renderLista();
}

function renderLista(){
  const items=filtroAtual?data.filter(q=>q.status===filtroAtual):data;
  const el=document.getElementById('lista');
  if(!items.length){
    el.innerHTML='<p class="muted">Nenhum orçamento em aberto'+(filtroAtual?' com esse status':'')+'.</p>';
    return;
  }
  el.innerHTML=items.map(q=>`
    <a href="orcamento-detalhe.html?id=${q.id}" class="quote-row">
      <div class="quote-row-left">
        <div class="quote-row-title">${esc(q.servico)}${q.precisa_follow_up?'<span class="flag-followup">follow-up</span>':''}</div>
        <div class="quote-row-meta">${esc(q.cliente_nome)} · ${relDate(q.created_at)}</div>
      </div>
      <div class="quote-row-right">
        <div class="quote-row-valor">${brl(q.valor)}</div>
        <span class="${badgeClass(q.status)}">${q.status}</span>${q.alteracao_texto&&!q.alteracao_resolvida&&!['Aprovado','Recusado'].includes(q.status)?'<span class="flag-followup" style="background:#FFE7A3">'+ic('lapis',14)+' pediu alteração</span>':''}
      </div>
    </a>`).join('');
}

(async()=>{
  const session=await requireSession(); if(!session)return;
  document.getElementById('top').innerHTML=topbar('radar.html');
  document.getElementById('nav').innerHTML=bottomNav('radar.html');
  wireLogout();
  const el=document.getElementById('lista');
  el.innerHTML=skeletonRows(3);
  try{
    const r=await api('/api/radar');
    data=r.quotes||[];
    document.getElementById('valor-aberto').textContent=brl(r.valorEmAberto);
    document.getElementById('total-aberto').textContent=`${r.total} orçamento${r.total!==1?'s':''} aguardando resposta`;
    renderLista();
  }catch(e){
    document.getElementById('valor-aberto').textContent='—';
    document.getElementById('total-aberto').textContent='';
    el.innerHTML=errorBlock(e.message||'Erro ao carregar.', ()=>location.reload());
  }
})();
</script>
</body></html>
