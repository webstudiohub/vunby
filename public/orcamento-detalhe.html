<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>VUNBY — Orçamento</title>
<link rel="manifest" href="manifest.json"/><meta name="theme-color" content="#0F3A8C"/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
<link rel="stylesheet" href="style.css"/>
<style>
/* Barra fixa de salvar enquanto edita: o botão fica sempre à vista */
.ed-barra{position:fixed;left:0;right:0;bottom:0;z-index:300;background:#fff;border-top:1px solid var(--gray2);box-shadow:0 -4px 16px rgba(0,0,0,.1);padding:10px 16px calc(12px + env(safe-area-inset-bottom))}
.ed-barra .error{margin:0 0 6px;min-height:0}
.ed-barra-btns{display:grid;grid-template-columns:1fr 2fr;gap:10px;max-width:600px;margin:0 auto}
body.editando{padding-bottom:120px}
.ed-salvo{background:#E8F7EE;border:1.5px solid var(--green);font-size:var(--fs-md)}
</style>
</head><body>
<div id="top"></div>
<div class="container" id="content"><p class="muted">Carregando…</p></div>
<script src="app.js"></script>
<script src="marca.js"></script>
<script src="pdf.js"></script>
<script src="calc.js"></script>
<script src="itens-editor.js"></script>
<script src="montar-tabela.js"></script>
<script>
const qid=new URLSearchParams(location.search).get('id');

async function registrarFollowUp(){
  const mensagem=document.getElementById('fu-msg').value;
  try{
    const r=await api(`/api/quotes/${qid}/followups`,{method:'POST',body:{mensagem}});
    document.getElementById('fu-msg').value='';
    if(r.whatsappLink)window.open(r.whatsappLink,'_blank');
    renderPage();
  }catch(e){alert(e.message);}
}

// Pedido de avaliação no Google: o link do WhatsApp abre direto (sem bloqueio de pop-up) e registramos o pedido
function pediuAvaliacao(){ api(`/api/quotes/${qid}/avaliacao`,{method:'POST'}).then(()=>setTimeout(renderPage,800)).catch(()=>{}); }

async function confirmarEnvio(fuId){
  await api(`/api/quotes/${qid}/followups/${fuId}/confirmar`,{method:'POST'});
  renderPage();
}

async function marcarStatus(status){
  try{await api(`/api/quotes/${qid}`,{method:'PATCH',body:{status}});renderPage();}
  catch(e){alert(e.message);}
}

let editorEd=null, editSujo=false;
// Ao sair da página com alterações não salvas, o navegador pergunta antes
window.addEventListener('beforeunload',e=>{ if(editSujo){ e.preventDefault(); e.returnValue=''; } });
document.addEventListener('input',e=>{ if(e.target.closest&&e.target.closest('#form-edicao')) editSujo=true; });
function abrirEdicao(){
  const form=document.getElementById('form-edicao');
  if(form.style.display===''&&editorEd) return; // já está aberto: não cria outro editor
  form.style.display=''; document.getElementById('btn-editar').style.display='none';
  document.body.classList.add('editando');
  const q=qAtual;
  editorEd=ItensEditor(document.getElementById('ed-itens'),{
    itens:q.itens, desconto:q.desconto_cents?(q.desconto_cents/100).toFixed(2).replace('.',','):'',
    taxa:q.taxa_cents?(q.taxa_cents/100).toFixed(2).replace('.',','):'', taxaNome:q.taxa_nome||'',
    sinalPct:Number(q.sinal_pct)?String(Number(q.sinal_pct)).replace('.',','):'',
  },()=>{ editSujo=true; document.getElementById('ed-valor-box').style.display=editorEd.quantos()?'none':''; },ferramentasItens(()=>editorEd,'ed-obs'));
  document.getElementById('ed-valor-box').style.display=editorEd.quantos()?'none':'';
}
function fecharEdicao(){
  if(editSujo&&!confirm('Descartar as alterações que você fez?')) return;
  editSujo=false; editorEd=null; document.body.classList.remove('editando');
  document.getElementById('form-edicao').style.display='none'; document.getElementById('btn-editar').style.display='';
}
async function salvarEdicao(){
  const msg=document.getElementById('ed-msg'); msg.textContent='';
  const body={
    servico:document.getElementById('ed-servico').value,
    validade:document.getElementById('ed-validade').value,
    observacoes:document.getElementById('ed-obs').value,
  };
  if(editorEd.quantos()){ const erro=editorEd.validar(); if(erro){ msg.textContent=erro; return; } Object.assign(body,editorEd.dados()); }
  else { body.valor=document.getElementById('ed-valor').value; if(qAtual.usa_itens) body.itens=[]; }
  const btn=document.getElementById('ed-salvar'); btn.disabled=true; btn.textContent='Salvando…';
  try{
    await api(`/api/quotes/${qid}`,{method:'PATCH',body});
    editSujo=false; editorEd=null; document.body.classList.remove('editando');
    await renderPage();
    const aviso=document.createElement('div'); aviso.className='card ed-salvo'; aviso.setAttribute('role','status');
    aviso.innerHTML='✅ <strong>Alterações salvas.</strong> O link do cliente já mostra a versão nova.';
    document.getElementById('content').prepend(aviso); window.scrollTo({top:0,behavior:'smooth'});
  }
  catch(e){ msg.textContent=e.message; btn.disabled=false; btn.textContent='Salvar alterações'; }
}

async function toggleFollowUp(atual){
  await api(`/api/quotes/${qid}`,{method:'PATCH',body:{precisaFollowUp:!atual}});renderPage();
}

// PDF feito no próprio aparelho, com logo e dados da empresa (sem servidor)
let qAtual=null, empresaCache=null;
// Itens para o PDF: aprovado → só o que o cliente escolheu (registro congelado); antes → todos, com opcionais marcados
function dadosItensPdf(q){
  if(q.status==='Aprovado'&&q.aprovacao){
    const a=q.aprovacao;
    return {itens:a.itens.map(i=>({...i,tipo:'incluido'})),resumo:a.resumo,valor:a.total/100,taxaNome:q.taxa_nome,condicoes:q.condicoes,rotuloValor:'TOTAL APROVADO',
      pacotes:(q.pacotes||[]).filter(p=>p.escolhido)};
  }
  const pp=(q.pacotes||[]).find(p=>p.destaque)||(q.pacotes||[])[0];
  const resumo=VCalc.calcular({itens:q.itens,desconto_cents:q.desconto_cents,taxa_cents:q.taxa_cents,sinal_pct:q.sinal_pct,pacote_cents:pp?Math.round(pp.preco*100):0},null);
  return {itens:q.itens,resumo,valor:resumo.total/100,taxaNome:q.taxa_nome,condicoes:q.condicoes,rotuloValor:'TOTAL'};
}

async function gerarPdf(){
  const btn=document.getElementById('btn-pdf'), msg=document.getElementById('pdf-msg');
  msg.textContent=''; btn.disabled=true; btn.textContent='Gerando PDF…';
  try{
    if(!empresaCache){
      const u=await api('/api/auth/me');
      const logo=u.temLogo?(await api('/api/auth/logo').catch(()=>({}))).logo:null;
      empresaCache={nome:u.nomeEmpresa||u.nome,profissao:u.profissao,cidade:u.cidade,whatsapp:u.whatsapp,documento:u.documento,instagram:u.instagram,logo};
    }
    const q=qAtual;
    const blob=await gerarPdfOrcamento({
      empresa:empresaCache, servico:q.servico, clienteNome:q.cliente.nome, clienteDocumento:q.cliente.documento, clienteEndereco:q.cliente.endereco, valor:q.valor, validade:q.validade,
      observacoes:q.observacoes, data:q.created_at, pacotes:q.pacotes, link:q.publicUrl,
      linkTexto:['Aprovado','Recusado'].includes(q.status)?'Ver este orçamento online':undefined,
      ...(q.usa_itens?dadosItensPdf(q):{}),
    });
    const limpo=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9 ]+/g,' ').trim().replace(/\s+/g,'-').slice(0,40);
    await compartilharPdf(blob,`Orcamento-${limpo(q.servico)||q.id}-${limpo(q.cliente.nome)}.pdf`.replace(/-+\.pdf$/,'.pdf'));
  }catch(e){ msg.textContent='Não foi possível gerar o PDF. '+(e.message||''); }
  btn.disabled=false; btn.textContent='📄 Enviar PDF do orçamento';
}

function listaItensHtml(q){
  const R=VCalc.reais, aprovado=q.status==='Aprovado';
  const linhas=q.itens.map(i=>{
    const fora=aprovado?i.escolhido===false:false;
    const tag=i.tipo==='incluido'?'':`<span class="flag-followup" style="margin-left:4px">${aprovado?(i.escolhido?'cliente escolheu':'cliente não quis'):(i.tipo==='opcional'?'opcional':'recomendado')}</span>`;
    return `<div style="display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #F2F2F7;${fora?'opacity:.5':''}">
      <span style="font-size:var(--fs-md)"><strong>${esc(i.descricao)}</strong>${tag}<br><span class="muted" style="font-size:var(--fs-sm)">${VCalc.qtdBR(i.qtd)} × ${R(i.preco_cents)} por ${VCalc.nomeUnidade(i.unidade)}</span></span>
      <strong style="white-space:nowrap;font-size:var(--fs-md)">${R(VCalc.linhaCents(i))}</strong></div>`;}).join('');
  const ex=[q.desconto_cents>0?`Desconto: − ${R(q.desconto_cents)}`:'',q.taxa_cents>0?`${esc(q.taxa_nome||'Taxa')}: ${R(q.taxa_cents)}`:'',Number(q.sinal_pct)>0?`Sinal: ${VCalc.qtdBR(q.sinal_pct)}%${q.aprovacao?` (${R(q.aprovacao.sinal)})`:''}`:''].filter(Boolean).join(' · ');
  return `<div style="margin:10px 0 4px">${linhas}</div>${ex?`<p class="muted" style="font-size:var(--fs-sm)">${ex}</p>`:''}`;
}

async function renderPage(){
  const q=await api(`/api/quotes/${qid}`);
  qAtual=q;
  const el=document.getElementById('content');

  const final=['Aprovado','Recusado'].includes(q.status);
  const statusBtns=['Enviado','Visualizado','Sem resposta','Aprovado','Recusado']
    .filter(s=>s!==q.status&&!['Aprovado','Recusado'].includes(q.status))
    .map(s=>`<button class="btn-outline btn-sm" onclick="marcarStatus('${s}')">${s}</button>`)
    .join(' ');

  const pacotesHtml=q.pacotes.length?`<div class="card"><h3>Pacotes</h3>${q.pacotes.map(p=>`
    <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #F2F2F7">
      <span>${esc(p.nome)} ${p.escolhido?'<span class="badge badge-aprovado">✓ escolhido pelo cliente</span>':''} ${p.destaque?'<span class="flag-followup">destaque</span>':''}</span>
      <strong>${brl(p.preco)}</strong>
    </div>`).join('')}</div>`:'';

  const fuHtml=q.followUps.length===0?'<p class="muted">Nenhum follow-up ainda.</p>':
    q.followUps.map(f=>{
      const dt=new Date(f.created_at).toLocaleString('pt-BR');
      if(f.estado==='preparado')return`<div style="padding:10px 0;border-bottom:1px solid #F2F2F7">
        <div class="muted" style="font-size:var(--fs-sm)">${dt}</div>
        <p style="margin:4px 0">${esc(f.mensagem||'(sem mensagem)')}</p>
        <button class="btn-outline btn-sm" onclick="confirmarEnvio(${f.id})">✓ Confirmar que enviei</button>
      </div>`;
      return`<div style="padding:10px 0;border-bottom:1px solid #F2F2F7">
        <div class="muted" style="font-size:var(--fs-sm)">${dt} — <em>enviado</em></div>
        <p style="margin:4px 0">${esc(f.mensagem||'(sem mensagem)')}</p>
      </div>`;
    }).join('');

  const altCard=q.alteracao_texto&&!q.alteracao_resolvida&&!final?`<div class="card" style="border:2px solid #E3B23C;background:#FFFBEB">
      <h3>✏️ O cliente pediu uma alteração</h3>
      <p class="muted" style="font-size:var(--fs-sm)">${new Date(q.alteracao_em).toLocaleString('pt-BR')}</p>
      <p style="font-size:var(--fs-md);margin:8px 0 12px;white-space:pre-line">“${esc(q.alteracao_texto)}”</p>
      ${(q.versao||1)>=3?`<p style="font-size:var(--fs-sm);background:#fff;border-radius:8px;padding:8px 10px;margin:0 0 10px">Este orçamento já está na <strong>versão ${q.versao}</strong>. Se os pedidos continuarem, vale uma conversa rápida com o cliente para fechar o que entra.</p>`:''}
      <button class="btn-primary" onclick="abrirEdicao();document.getElementById('form-edicao').scrollIntoView({behavior:'smooth'})">Ajustar o orçamento</button>
      <p class="muted" style="font-size:var(--fs-sm);margin-top:8px">Ao salvar, o link do cliente mostra a versão nova e este aviso some.</p></div>`:'';
  el.innerHTML=`${altCard}
    <div class="card">
      <h2>${esc(q.servico)}</h2>
      <div style="margin-bottom:12px">
        <span class="${badgeClass(q.status)}">${q.status}</span>
        ${q.precisa_follow_up?'<span class="flag-followup">follow-up</span>':''}
        ${q.expirado?'<span class="badge" style="background:#FFE0DE;color:#C0392B;margin-left:4px">Expirado</span>':''}
      </div>
      <p><strong>Cliente:</strong> ${esc(q.cliente.nome)}</p>
      <p><strong>Telefone:</strong> ${esc(q.cliente.telefone)}</p>
      ${q.cliente.endereco?`<p><strong>Endereço:</strong> ${esc(q.cliente.endereco)}</p>`:''}
      ${q.cliente.email?`<p><strong>E-mail:</strong> ${esc(q.cliente.email)}</p>`:''}
      ${q.cliente.documento?`<p><strong>${q.cliente.documento.length>14?'CNPJ':'CPF'}:</strong> ${esc(q.cliente.documento)}</p>`:''}
      ${q.cliente.id?`<button type="button" class="btn-link-editar" onclick="abrirEditarCliente(qAtual.cliente,()=>renderPage())">✏️ Editar cliente</button>`:''}
      <p><strong>${q.usa_itens?(q.status==='Aprovado'?'Total aprovado':'Total'):'Valor'}:</strong> <span style="font-size:var(--fs-xl);font-weight:800;color:#0F3A8C">${brl(q.valor)}</span></p>
      ${q.usa_itens?listaItensHtml(q):''}
      ${q.validade?`<p><strong>Validade:</strong> ${new Date(String(q.validade).slice(0,10)+'T12:00:00').toLocaleDateString('pt-BR')}</p>`:''}
      ${q.observacoes?`<p><strong>Obs:</strong> ${esc(q.observacoes)}</p>`:''}
      ${q.recusa_motivo?`<p><strong>Motivo da recusa:</strong> ${esc(q.recusa_motivo)}</p>`:''}
      ${q.resposta_cliente?`<p><strong>Comentário do cliente:</strong> ${esc(q.resposta_cliente)}</p>`:''}
      ${final?'':`<div style="margin-top:12px">
        <button class="btn-outline btn-sm" id="btn-editar" onclick="abrirEdicao()">✏️ Editar orçamento</button>
        <div id="form-edicao" style="display:none;margin-top:8px">
          <label>Serviço / descrição</label>
          <input id="ed-servico" value="${esc(q.servico)}"/>
          <label>Itens</label>
          <div id="ed-itens"></div>
          <div id="ed-valor-box"><label>Ou só o valor total (R$)</label>
          <input id="ed-valor" type="number" step="0.01" min="0" inputmode="decimal" value="${q.valor}"/></div>
          <label>Validade</label>
          <input id="ed-validade" type="date" value="${q.validade?String(q.validade).slice(0,10):''}"/>
          <label>Observações</label>
          <textarea id="ed-obs" rows="2">${esc(q.observacoes||'')}</textarea>
          <p class="muted" style="font-size:var(--fs-sm);margin-top:6px">O link do cliente mostra a versão atualizada automaticamente. Se ele estiver com a página aberta, ela recarrega antes de aprovar.</p>
          <div class="ed-barra">
            <div id="ed-msg" class="error" role="alert"></div>
            <div class="ed-barra-btns">
              <button class="btn-outline" onclick="fecharEdicao()">Cancelar</button>
              <button class="btn-primary btn-gold" id="ed-salvar" onclick="salvarEdicao()">Salvar alterações</button>
            </div>
          </div>
        </div>
      </div>`}
      <p style="margin-top:8px"><a href="/orcamento.html?token=${encodeURIComponent(q.public_token)}" target="_blank" style="font-size:var(--fs-sm)">🔗 Ver página do cliente</a></p>
      <button class="btn-primary btn-gold" id="btn-pdf" style="margin-top:12px" onclick="gerarPdf()">📄 Enviar PDF do orçamento</button>
      <div id="pdf-msg" class="error"></div>
    </div>

    <div class="card">
      <h3>Ações rápidas</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${statusBtns}
        <button class="btn-outline btn-sm" onclick="toggleFollowUp(${q.precisa_follow_up})">${q.precisa_follow_up?'✓ Tirar follow-up':'+ Marcar follow-up'}</button>
      </div>
    </div>

    ${q.status==='Aprovado'?`<div class="card" style="border:1.5px solid #F5C000">
      <h3>⭐ Avaliação no Google</h3>
      ${q.avaliacaoWhatsApp?`
        <p class="muted" style="font-size:var(--fs-sm);margin-bottom:10px">${q.avaliacao_pedida_em?`Pedido enviado em ${new Date(q.avaliacao_pedida_em).toLocaleDateString('pt-BR')}.`:'Serviço aprovado! Peça a avaliação de 2 a 48 horas depois de terminar — é quando o cliente mais responde.'}</p>
        <a href="${esc(q.avaliacaoWhatsApp)}" target="_blank" rel="noopener" onclick="pediuAvaliacao()"><button class="btn-primary btn-gold">${q.avaliacao_pedida_em?'Pedir de novo pelo WhatsApp':'Pedir avaliação pelo WhatsApp'}</button></a>`
      :`<p class="muted" style="font-size:var(--fs-sm)">Cadastre o link de avaliação do seu Google Meu Negócio em <a href="conta.html">Minha Conta</a> para pedir a avaliação com 1 toque.</p>`}
    </div>`:''}

    ${pacotesHtml}

    <div class="card">
      <h3>Follow-up</h3>
      <p class="muted" style="font-size:var(--fs-sm);margin-bottom:10px">Passo 1: clique no botão — abrirá o WhatsApp com a mensagem. Passo 2: confirme que enviou.</p>
      <textarea id="fu-msg" rows="2" placeholder="Mensagem (deixe vazio para padrão)"></textarea>
      <div style="margin-top:10px"><button class="btn-primary" onclick="registrarFollowUp()">Abrir WhatsApp</button></div>
    </div>

    <div class="card">
      <h3>Histórico de follow-ups (${q.followUps.length})</h3>
      ${fuHtml}
    </div>`;
}

(async()=>{
  const session=await requireSession();if(!session)return;
  document.getElementById('top').innerHTML=topbar('');wireLogout();
  if(!qid){document.getElementById('content').innerHTML='<p class="error">ID inválido.</p>';return;}
  renderPage();
})();
</script>
</body></html>
