<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>VUNBY — Nota rápida</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=2"/>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#0F3A8C"/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2"/>
<link rel="stylesheet" href="style.css?v=54"/>
</head><body>
<div id="top"></div>
<div class="container" style="margin-bottom:calc(var(--nav-h) + var(--sp-5))">
  <div class="page-header anim">
    <h1>Nota rápida</h1>
    <p>30 segundos. Assim a gente vê se o VUNBY está melhorando para você.</p>
  </div>
  <div class="card anim anim-1" id="form">
    <label style="margin-top:0">De 0 a 10, quanto você recomendaria o VUNBY para um colega?</label>
    <div class="nota-grid" id="nota"></div>
    <label>Quer deixar um comentário? (opcional)</label>
    <textarea id="f-comentario" rows="3" maxlength="1000" placeholder="O que melhorou, o que piorou, o que falta…"></textarea>
    <div style="margin-top:var(--sp-5)">
      <button class="btn-primary btn-gold" id="btn-enviar">Enviar</button>
      <button class="btn-outline" id="btn-depois" style="margin-top:var(--sp-3)">Responder depois</button>
    </div>
    <div id="msg" class="error"></div>
  </div>
</div>
<div id="nav"></div>
<script src="ui.js?v=54"></script>
<script src="app.js?v=54"></script>
<script>
let nota=null;
const notaEl=document.getElementById('nota');
for(let i=0;i<=10;i++){
  const b=document.createElement('button'); b.type='button'; b.textContent=i;
  b.onclick=()=>{nota=i; notaEl.querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x===b));};
  notaEl.appendChild(b);
}
document.getElementById('btn-enviar').onclick=async()=>{
  const msg=document.getElementById('msg'), btn=document.getElementById('btn-enviar');
  msg.textContent='';
  if(nota===null){msg.textContent='Escolha uma nota de 0 a 10.';return;}
  btn.disabled=true; btn.textContent='Enviando…';
  try{
    await api('/api/feedback/pulso',{method:'POST',body:{nota,comentario:document.getElementById('f-comentario').value}});
    document.getElementById('form').innerHTML='<h3>Obrigado! <span style="color:var(--red)">'+ic('coracao',20)+'</span></h3><p class="muted">Sua nota ajuda o VUNBY a melhorar.</p><a href="dashboard.html"><button class="btn-primary" style="margin-top:var(--sp-4)">Voltar ao início</button></a>';
  }catch(e){msg.textContent=e.message; btn.disabled=false; btn.textContent='Enviar';}
};
document.getElementById('btn-depois').onclick=async()=>{
  await api('/api/feedback/pulso/adiar',{method:'POST'}).catch(()=>{});
  location.href='dashboard.html';
};
(async()=>{
  const session=await requireSession(); if(!session)return;
  document.getElementById('top').innerHTML=topbar('');
  document.getElementById('nav').innerHTML=bottomNav('');
  wireLogout();
})();
</script>
<style>
.nota-grid{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;margin-top:8px}
.nota-grid button{min-height:40px;border:1.5px solid var(--gray2);background:#fff;border-radius:8px;font-weight:700;color:var(--dark);cursor:pointer;padding:0}
.nota-grid button.sel{background:var(--navy);border-color:var(--navy);color:#fff}
@media (max-width:380px){.nota-grid{grid-template-columns:repeat(6,1fr)}}
</style>
</body></html>
