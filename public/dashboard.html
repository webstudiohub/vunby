<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>VUNBY — Início</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=2"/>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#0F3A8C"/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2"/>
<link rel="stylesheet" href="style.css?v=51"/>
</head><body>
<div id="top"></div>
<div class="container">
  <div class="page-header anim">
    <h1 id="greeting"><span class="skeleton-line" style="display:block;width:70%;height:30px;border-radius:9px"></span></h1>
    <p>Resumo dos seus orçamentos</p>
  </div>

  <div id="aviso-plano"></div>
  <div id="hero-mes" class="hero-mes anim"><div class="hm-rot">Fechado este mês</div><div class="hm-val">—</div><div class="hm-graf"></div></div>
  <nav class="atalhos anim anim-1" aria-label="Atalhos">
    <a href="novo-orcamento.html"><span class="ico"><i data-ic="mais" data-tam="24"></i></span>Novo orçamento</a>
    <a href="novo-orcamento.html#novo-cliente"><span class="ico"><i data-ic="pessoa" data-tam="24"></i></span>Novo cliente</a>
    <a href="tabela.html"><span class="ico"><i data-ic="preco" data-tam="24"></i></span>Minha tabela</a>
    <a href="radar.html"><span class="ico"><i data-ic="alvo" data-tam="24"></i></span>Radar</a>
  </nav>
  <div id="aviso-empresa"></div>
  <div id="aviso-instalar"></div>

  <div id="stats-area" class="stat-grid">
    <div class="stat-card anim anim-1"><div class="stat-label">Em aberto</div><div class="stat-value">—</div></div>
    <div class="stat-card anim anim-2"><div class="stat-label">Follow-ups</div><div class="stat-value">—</div></div>
    <div class="stat-card anim anim-3"><div class="stat-label">Visualizados</div><div class="stat-value">—</div></div>
    <div class="stat-card anim anim-4"><div class="stat-label">Aprovados</div><div class="stat-value">—</div></div>
  </div>

  <div class="card anim anim-5" id="recent-area">
    <h3>Orçamentos recentes</h3>
    <div id="recent-list"><div class="skeleton-row"><div class="skeleton-line" style="width:60%"></div><div class="skeleton-line" style="width:35%"></div></div><div class="skeleton-row"><div class="skeleton-line" style="width:60%"></div><div class="skeleton-line" style="width:35%"></div></div><div class="skeleton-row"><div class="skeleton-line" style="width:60%"></div><div class="skeleton-line" style="width:35%"></div></div><div class="skeleton-row"><div class="skeleton-line" style="width:60%"></div><div class="skeleton-line" style="width:35%"></div></div></div>
  </div>
</div>
<div id="nav"></div>
<script src="ui.js?v=51"></script>
<script src="instalar.js?v=36"></script>
<script src="app.js?v=51"></script>
<script>
(async()=>{
  const session=await requireSession(); if(!session)return;
  document.getElementById('top').innerHTML=topbar('dashboard.html');
  document.getElementById('nav').innerHTML=bottomNav('dashboard.html');
  wireLogout();
  if(window.VUI&&VUI.hidratar) VUI.hidratar(document.querySelector('.atalhos'));
  if(window.VunbyInstalar) VunbyInstalar.banner(document.getElementById('aviso-instalar'));

  const primeiroNome=(session.nome||'').split(' ')[0];
  const hora=new Date().getHours();
  const saudacao=hora<12?'Bom dia':hora<18?'Boa tarde':'Boa noite';
  document.getElementById('greeting').textContent=`${saudacao}, ${primeiroNome}`;
  if(!session.perfilCompleto){
    document.getElementById('aviso-empresa').innerHTML=`<a href="configurar-empresa.html" class="card aviso-plano aviso-plano-trial">
      <span>${ic('empresa')} <strong>Complete os dados da empresa</strong> para seus orçamentos saírem com a sua cara.</span>
      <span class="aviso-plano-link">Completar ›</span>
    </a>`;
  }
  api('/api/billing/status').then(st=>{document.getElementById('aviso-plano').innerHTML=avisoPlano(st);}).catch(()=>{});

  const [dash,quotes]=await Promise.all([api('/api/dashboard'),api('/api/quotes')]);
  const s=dash.stats||{};
  const vis=(s['Visualizado']||{count:0});
  const apr=(s['Aprovado']||{count:0});

  // Cabeçalho: quanto fechou no mês (aprovados) + orçamentos enviados nos últimos 7 dias
  const agora=new Date(), mesIni=new Date(agora.getFullYear(),agora.getMonth(),1), mesAntIni=new Date(agora.getFullYear(),agora.getMonth()-1,1);
  const dataAprov=q=>new Date(q.responded_at||q.updated_at||q.created_at);
  const aprovados=quotes.filter(q=>q.status==='Aprovado');
  const doMes=aprovados.filter(q=>dataAprov(q)>=mesIni), doAnt=aprovados.filter(q=>{const d=dataAprov(q);return d>=mesAntIni&&d<mesIni;});
  const soma=l=>l.reduce((t,q)=>t+Number(q.valor||0),0);
  const vMes=soma(doMes), vAnt=soma(doAnt);
  const nomeMes=agora.toLocaleDateString('pt-BR',{month:'long'});
  let tend='';
  if(vAnt>0){ const pct=Math.round((vMes-vAnt)/vAnt*100); tend=`<span class="hm-tend ${pct>=0?'up':'down'}">${pct>=0?'▲':'▼'} ${Math.abs(pct)}%</span> vs mês passado`; }
  const dias=[...Array(7)].map((_,i)=>{const d=new Date(agora.getFullYear(),agora.getMonth(),agora.getDate()-6+i);return d;});
  const cont=dias.map(d=>quotes.filter(q=>{const c=new Date(q.created_at);return c.getFullYear()===d.getFullYear()&&c.getMonth()===d.getMonth()&&c.getDate()===d.getDate();}).length);
  const max=Math.max(1,...cont);
  const sem=['D','S','T','Q','Q','S','S'];
  document.getElementById('hero-mes').innerHTML=`
    <div class="hm-rot">Fechado em ${nomeMes}</div>
    <div class="hm-val">${brl(vMes)}</div>
    <div class="hm-sub">${doMes.length} aprovado${doMes.length!==1?'s':''} ${tend?'· '+tend:''}</div>
    <div class="hm-graf" title="Orçamentos criados nos últimos 7 dias">${cont.map((c,i)=>`<div class="${i===6?'hoje':''}"><b style="height:${Math.round(c/max*100)}%"></b><span>${sem[dias[i].getDay()]}</span></div>`).join('')}</div>
    <div class="hm-sub" style="margin-top:6px;font-size:12px;color:#AFC3E8">Orçamentos criados nos últimos 7 dias: ${cont.reduce((a,b)=>a+b,0)}</div>`;

  document.getElementById('stats-area').innerHTML=`
    <a href="radar.html" class="stat-card accent-navy anim anim-1" style="text-decoration:none">
      <span class="stat-ico">${ic('alvo',18)}</span><div class="stat-label">Em aberto</div>
      <div class="stat-value navy">${brl(dash.valorEmAberto)}</div>
    </a>
    <a href="radar.html" class="stat-card accent-gold anim anim-2" style="text-decoration:none">
      <span class="stat-ico">${ic('sino',18)}</span><div class="stat-label">Follow-ups</div>
      <div class="stat-value gold">${dash.pendentesFollowUp}</div>
    </a>
    <div class="stat-card anim anim-3">
      <span class="stat-ico">${ic('olho',18)}</span><div class="stat-label">Visualizados</div>
      <div class="stat-value">${vis.count}</div>
    </div>
    <div class="stat-card accent-green anim anim-4">
      <span class="stat-ico">${ic('ok',18)}</span><div class="stat-label">Aprovados</div>
      <div class="stat-value green">${apr.count}</div>
    </div>`;

  const recentes=quotes.slice(0,5);
  if(!recentes.length){
    document.getElementById('recent-list').innerHTML=vazioHtml('Nenhum orçamento ainda','Crie o primeiro e comece a fechar negócios.','<a href="novo-orcamento.html"><button class="btn-primary btn-gold" style="width:auto;padding:0 var(--sp-6)">Criar primeiro orçamento</button></a>');
    return;
  }
  document.getElementById('recent-list').innerHTML=recentes.map(q=>linhaOrcamento(q)).join('');
})();
</script>
</body></html>
