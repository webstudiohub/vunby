<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Orçamento</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=2"/><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2"/>
<meta name="robots" content="noindex,nofollow"/>
<link rel="stylesheet" href="style.css?v=53"/>
<style>
.alt-texto{width:100%;padding:12px;border:1.5px solid #CBD2DA;border-radius:10px;font-size:var(--fs-md);margin-bottom:12px;resize:vertical;font-family:inherit}
.alt-sec{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.alt-btn{min-height:48px;border:1.5px solid #CBD2DA;background:#fff;border-radius:10px;font:inherit;font-size:var(--fs-md);font-weight:700;color:#3A4550;cursor:pointer}
.alt-painel{background:#F4F6F9;border-radius:12px;padding:16px;margin-top:12px}
.alt-rot{display:block;font-size:var(--fs-md);font-weight:700;color:#0F1923;margin:0 0 10px}
.alt-motivo{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid #E4E8EE;border-radius:10px;padding:12px 14px;margin:0 0 8px;font-size:var(--fs-md);font-weight:600;color:#0F1923;cursor:pointer;min-height:48px}
.alt-motivo input{width:22px;height:22px;margin:0;appearance:auto;-webkit-appearance:radio;accent-color:#0F3A8C}
.alt-azul{background:#0F3A8C}
.alt-recusa{width:100%;min-height:48px;background:#fff;border:2px solid #C0392B;color:#C0392B;border-radius:10px;font:inherit;font-size:var(--fs-md);font-weight:700;cursor:pointer}
.alt-ok{background:#E6EEFB;border-radius:12px;padding:16px;margin-top:12px;font-size:var(--fs-md);line-height:1.5}
.alt-aviso{background:#FFF8E1;border:1.5px solid #E3B23C;border-radius:12px;padding:14px 16px;margin-bottom:14px;font-size:var(--fs-md);line-height:1.5}
.it-titulo{font-size:var(--fs-lg);font-weight:700;color:#0F1923;margin:24px 0 8px}
.it-ajuda{font-size:var(--fs-md);color:#5B6675;margin-bottom:10px;line-height:1.45}
.it-lista{border:1.5px solid #E5E5EA;border-radius:12px;overflow:hidden}
.it-linha{display:flex;align-items:flex-start;gap:12px;padding:14px;border-bottom:1px solid #EEF0F3;margin:0;text-transform:none;letter-spacing:0;font-weight:400;color:inherit;background:#fff}
.it-linha:last-child{border-bottom:none}
.it-opc{cursor:pointer}
.it-off{background:#FAFAFB}.it-off .it-desc,.it-off .it-val{color:#5B6675}
.it-check{-webkit-appearance:checkbox;appearance:auto;width:24px!important;height:24px!important;min-height:0!important;padding:0!important;margin:1px 0 0!important;border:none!important;box-shadow:none!important;flex-shrink:0;accent-color:#0F3A8C}
.it-ok{width:24px;flex-shrink:0;text-align:center;color:#2DB56D;font-weight:800;font-size:var(--fs-md)}
.it-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.it-desc{font-size:var(--fs-md);font-weight:600;color:#0F1923;line-height:1.3}
.it-det{font-size:var(--fs-sm);color:#5B6675}
.it-tag{font-size:var(--fs-sm);font-weight:700;color:#0F3A8C;background:#EEF4FA;align-self:flex-start;padding:2px 8px;border-radius:10px;margin-top:2px}
.it-tag-rec{color:#8A6100;background:#FFF3CC}
.it-val{font-size:var(--fs-md);font-weight:700;color:#0F3A8C;white-space:nowrap}
.it-resumo{margin-top:12px}
.it-res{display:flex;justify-content:space-between;font-size:var(--fs-md);padding:5px 2px;color:#3A4550}
.it-res-total{font-size:var(--fs-xl);font-weight:800;color:#0F1923;border-top:1.5px solid #E5E5EA;margin-top:4px;padding-top:10px}
.it-cond{background:#F2F2F7;border-radius:10px;padding:14px;margin-top:14px;font-size:var(--fs-md)}.it-cond p{margin-top:4px;white-space:pre-line}
.it-confirma{background:#EEF4FA;border:1.5px solid #0F3A8C;border-radius:12px;padding:16px;margin-top:14px;font-size:var(--fs-md);line-height:1.5}
.it-barra{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border-top:1px solid #E5E5EA;box-shadow:0 -4px 16px rgba(0,0,0,.08);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:20}
.it-barra .btn-accept{width:auto;padding:0 28px}
.it-barra-rot{font-size:var(--fs-sm);color:#5B6675;font-weight:700;}
.it-barra-val{font-size:var(--fs-xl);font-weight:800;color:#0F3A8C;line-height:1.1}
.it-barra-sinal{font-size:var(--fs-sm);color:#5B6675}
body:has(.it-barra){padding-bottom:96px}
.pkg-escolhido{outline:2.5px solid #0F3A8C;background:#EEF4FA}.pkg-radio{display:inline-block;width:16px;height:16px;border:2px solid #0F3A8C;border-radius:50%;margin-right:8px;vertical-align:-2px}.pkg-escolhido .pkg-radio{background:#0F3A8C;box-shadow:inset 0 0 0 3px #fff}</style>
</head><body style="background:#F2F2F7">
<div style="max-width:520px;margin:0 auto;padding:0 0 40px">
  <div id="content"><div style="padding:40px;text-align:center"><p class="muted">Carregando orçamento…</p></div></div>
</div>
<script src="ui.js?v=53"></script>
<script src="marca.js?v=33"></script>
<script src="calc.js?v=33"></script>
<script>
// NÃO referencia app.js, manifest, SW — página pública do cliente
const token=new URLSearchParams(location.search).get('token');

function brl(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

async function api(path,opts={}){
  const res=await fetch(path,{...opts,headers:{'Content-Type':'application/json'}});
  const d=await res.json().catch(()=>({}));
  if(!res.ok)throw new Error(d.error||'Erro');
  return d;
}

let pacoteSel=null, Q=null;
const escolhidos=new Set(); // opcionais/recomendados marcados pelo cliente
function escolherPacote(id){
  pacoteSel=id;
  document.querySelectorAll('.pkg-card[data-id]').forEach(el=>el.classList.toggle('pkg-escolhido',String(el.dataset.id)===String(id)));
  const m=document.getElementById('msg-acao'); if(m) m.textContent='';
  atualizarTotal();
}

// ─── Orçamento por itens: total ao vivo (o servidor recalcula na aprovação) ───
function calcAtual(){
  const pac=(Q.pacotes||[]).find(p=>String(p.id)===String(pacoteSel));
  return VCalc.calcular({itens:Q.itens,desconto_cents:Q.descontoCents,taxa_cents:Q.taxaCents,sinal_pct:Q.sinalPct,pacote_cents:pac?Math.round(Number(pac.preco)*100):0},escolhidos);
}
function marcarItem(id,on){ if(on) escolhidos.add(String(id)); else escolhidos.delete(String(id)); document.querySelector(`.it-linha[data-id="${id}"]`)?.classList.toggle('it-off',!on); atualizarTotal(); }
function atualizarTotal(){
  if(!Q||!Q.usaItens) return;
  const r=calcAtual();
  const R=VCalc.reais;
  const set=(id,v)=>{const el=document.getElementById(id); if(el) el.innerHTML=v;};
  set('total-vivo',R(r.total));
  set('barra-total',R(r.total));
  set('barra-sinal',r.sinal?`Sinal ${R(r.sinal)}`:'');
  set('resumo-itens',
    (r.desconto||r.taxa||r.pacote?`<div class="it-res"><span>Itens</span><span>${R(r.itens)}</span></div>`:'')+
    (r.pacote?`<div class="it-res"><span>Opção escolhida</span><span>${R(r.pacote)}</span></div>`:'')+
    (r.desconto?`<div class="it-res"><span>Desconto</span><span>− ${R(r.desconto)}</span></div>`:'')+
    (r.taxa?`<div class="it-res"><span>${esc(Q.taxaNome||'Taxa')}</span><span>${R(r.taxa)}</span></div>`:'')+
    `<div class="it-res it-res-total"><span>Total</span><span>${R(r.total)}</span></div>`+
    (r.sinal?`<div class="it-res"><span>Sinal para começar (${VCalc.qtdBR(Q.sinalPct)}%)</span><span>${R(r.sinal)}</span></div>`:''));
}
function itensHtml(q,podeEscolher){
  const R=VCalc.reais;
  const ap=q.aprovacao;
  // Depois de aprovado: mostra exatamente o que foi aprovado (registro congelado)
  const lista=ap&&q.status==='Aprovado'?ap.itens.map(i=>({...i,tipo:'incluido'})):q.itens;
  const linha=i=>{
    const opc=i.tipo!=='incluido';
    const on=!opc||escolhidos.has(String(i.id));
    const det=`${VCalc.qtdBR(i.qtd)} × ${R(i.preco_cents)} por ${VCalc.nomeUnidade(i.unidade)}`;
    const controle=opc&&podeEscolher
      ?`<input type="checkbox" class="it-check" ${on?'checked':''} onchange="marcarItem('${i.id}',this.checked)" aria-label="Incluir ${esc(i.descricao)}"/>`
      :`<span class="it-ok" aria-hidden="true">✓</span>`;
    const tag=opc?`<span class="it-tag ${i.tipo==='recomendado'?'it-tag-rec':''}">${i.tipo==='recomendado'?'Recomendado · pode tirar':'Opcional · '+(on?'incluído':'toque para adicionar')}</span>`:'';
    const foto=i.foto||((q.itens||[]).find(x=>x.descricao===i.descricao&&x.foto)||{}).foto;
    const mini=foto?`<button type="button" class="it-mini" onclick="event.preventDefault();event.stopPropagation();verFoto('${foto}')" aria-label="Ver foto de ${esc(i.descricao)}"><img src="${foto}" alt="" loading="lazy"/></button>`:'';
    return `<label class="it-linha${on?'':' it-off'}${opc&&podeEscolher?' it-opc':''}" data-id="${i.id||''}">
      ${controle}${mini}
      <span class="it-txt"><span class="it-desc">${esc(i.descricao)}</span><span class="it-det">${det}</span>${tag}</span>
      <span class="it-val">${opc&&!on?'+ ':''}${R(VCalc.linhaCents(i))}</span>
    </label>`;
  };
  const temOpc=podeEscolher&&q.itens.some(i=>i.tipo!=='incluido');
  return `<div class="it-titulo">Itens do orçamento</div>
    ${temOpc?'<p class="it-ajuda">Os itens com caixinha são opcionais: marque ou desmarque e o total muda na hora.</p>':''}
    <div class="it-lista">${lista.map(linha).join('')}</div>
    ${ap&&q.status==='Aprovado'&&ap.naoEscolhidos&&ap.naoEscolhidos.length?`<p class="it-ajuda">Não incluído: ${ap.naoEscolhidos.map(esc).join(', ')}</p>`:''}
    <div id="resumo-itens" class="it-resumo"></div>
    ${q.condicoes?`<div class="it-cond"><strong>Condições</strong><p>${esc(q.condicoes)}</p></div>`:''}`;
}

document.addEventListener('change',e=>{ if(e.target.name==='motivo'){ const m=document.getElementById('msg-acao'); if(m) m.textContent=''; } });
// Painéis de "Pedir alteração" e "Recusar"
function abrirPainel(qual){
  const el=document.getElementById('painel'), m=document.getElementById('msg-acao'); if(m) m.textContent='';
  if(el.dataset.aberto===qual){ el.innerHTML=''; el.dataset.aberto=''; return; }
  el.dataset.aberto=qual;
  if(qual==='alterar'){
    el.innerHTML=`<div class="alt-painel">
      <label for="alt-texto" class="alt-rot">O que você gostaria de mudar?</label>
      <textarea id="alt-texto" class="alt-texto" rows="3" maxlength="1000" placeholder="Ex.: tirar a montagem do armário e incluir a geladeira"></textarea>
      <button class="btn-accept alt-azul" style="width:100%" onclick="enviarAlteracao()">Enviar pedido de alteração</button></div>`;
    document.getElementById('alt-texto').focus();
  }else{
    el.innerHTML=`<div class="alt-painel">
      <p class="alt-rot">Pode contar o motivo? (opcional) Isso ajuda a melhorar o atendimento.</p>
      ${(Q.motivosRecusa||[]).map(t=>`<label class="alt-motivo"><input type="radio" name="motivo" value="${esc(t)}"/> ${esc(t)}</label>`).join('')}
      <textarea id="rec-obs" class="alt-texto" rows="2" placeholder="Quer comentar algo? (opcional)"></textarea>
      <button class="alt-recusa" onclick="acao('recusar')">Confirmar recusa</button></div>`;
  }
  el.scrollIntoView({behavior:'smooth',block:'center'});
}
async function enviarAlteracao(){
  const t=document.getElementById('alt-texto').value.trim(), m=document.getElementById('msg-acao');
  if(t.length<3){ m.textContent='Escreva o que você gostaria de mudar.'; return; }
  try{
    const r=await fetch(`/api/public/quote/${encodeURIComponent(token)}/alteracao`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({texto:t})});
    const d=await r.json().catch(()=>({})); if(!r.ok) throw new Error(d.error||'Erro');
    document.getElementById('painel').innerHTML=`<div class="alt-ok">${ic('ok',18)} <strong>Pedido enviado!</strong><br>${esc((Q.prestador&&Q.prestador.nome)||'O prestador')} vai ajustar e este mesmo link mostra a versão nova.</div>`;
    document.getElementById('painel').dataset.aberto='';
  }catch(e){ m.textContent=e.message; }
}

async function acao(tipo){
  const obs=document.getElementById('obs-acao')?.value||'';
  const m=document.getElementById('msg-acao');
  if(tipo==='aceitar' && window.__temPacotes && !pacoteSel){ if(m) m.textContent='Escolha uma das opções acima antes de aprovar.'; return; }
  // Orçamento por itens: mostra o resumo do que será aprovado antes de confirmar
  if(tipo==='aceitar' && Q.usaItens && !window.__confirmado){
    const r=calcAtual(), n=Q.itens.filter(i=>i.tipo==='incluido'||escolhidos.has(String(i.id))).length;
    document.getElementById('confirmar-area').innerHTML=`<div class="it-confirma">
      <p><strong>Você vai aprovar:</strong> ${n} ${n===1?'item':'itens'}, total <strong>${VCalc.reais(r.total)}</strong>${r.sinal?`, sinal de ${VCalc.reais(r.sinal)}`:''}.</p>
      <button class="btn-accept" style="width:100%;margin-top:10px" onclick="window.__confirmado=true;acao('aceitar')">✓ Confirmar aprovação</button>
      <button class="btn-reject" style="width:100%;margin-top:8px" onclick="document.getElementById('confirmar-area').innerHTML=''">Voltar e revisar</button>
    </div>`;
    document.getElementById('confirmar-area').scrollIntoView({behavior:'smooth',block:'center'});
    return;
  }
  try{
    const body={observacao:obs,pacoteId:pacoteSel};
    if(tipo==='recusar'){
      const mot=document.querySelector('input[name="motivo"]:checked');
      body.motivo=mot?mot.value:''; body.observacao=document.getElementById('rec-obs')?.value||'';
    }
    if(Q.usaItens){ body.escolhidos=[...escolhidos]; body.versao=Q.versao; }
    const res=await fetch(`/api/public/quote/${encodeURIComponent(token)}/${tipo==='aceitar'?'accept':'reject'}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await res.json().catch(()=>({}));
    if(d.recarregar){ if(m) m.textContent=d.error; setTimeout(()=>location.reload(),2500); return; }
    if(!res.ok) throw new Error(d.error||'Erro');
    document.getElementById('barra-fixa')?.remove();
    document.getElementById('acao-area').innerHTML=`<div style="background:${tipo==='aceitar'?'#D4FBDC':'#F2F2F7'};padding:20px;border-radius:12px;text-align:center">
      <div style="color:var(--green)">${ic(tipo==='aceitar'?'festa':'joinha',44)}</div>
      <p style="font-weight:700;margin-top:8px">${tipo==='aceitar'?'Orçamento aprovado!':'Resposta registrada.'}</p>
    </div>`;
  }catch(e){ if(m) m.textContent=e.message; }
}


// ─── Vitrine da empresa: confiança para o cliente fechar ───
function seloGoogle(v){
  if(!v||!v.nota) return '';
  const n=Number(v.nota), cheias=Math.round(n);
  return `<div class="selo-google" title="Avaliações de clientes que contrataram">${'★'.repeat(cheias)}${'☆'.repeat(5-cheias)} <b>${n.toFixed(1).replace('.',',')}</b> · ${Number(v.avaliacoes).toLocaleString('pt-BR')} avaliaç${v.avaliacoes>1?'ões':'ão'} verificada${v.avaliacoes>1?'s':''}</div>`;
}
function validadeHtml(q,final){
  if(!q.validade) return '';
  const fim=new Date(String(q.validade).slice(0,10)+'T23:59:59');
  const dias=Math.ceil((fim-Date.now())/86400000);
  const data=fim.toLocaleDateString('pt-BR');
  if(final||q.expirado||dias<0) return `<p style="font-size:var(--fs-sm);color:#5B6675;margin-top:6px">Válido até ${data}</p>`;
  if(dias<=7) return `<div class="validade-cont">⏳ ${dias<=1?'<b>Este preço vale só até hoje</b>':`Este preço vale por mais <b>${dias} dias</b>`} <span>(até ${data})</span></div>`;
  return `<p style="font-size:var(--fs-sm);color:#5B6675;margin-top:6px">Válido até ${data}</p>`;
}
function vitrineHtml(q){
  const v=q.vitrine||{}, emp=esc(q.prestador&&q.prestador.nome||'');
  let h='';
  if((v.diferenciais||[]).length) h+=`<div class="vit-bloco"><h3 class="vit-tit">Por que escolher ${emp}</h3><ul class="vit-dif">${v.diferenciais.map(d=>`<li><span>✓</span>${esc(d)}</li>`).join('')}</ul></div>`;
  if((v.fotos||[]).length) h+=`<div class="vit-bloco"><h3 class="vit-tit">Trabalhos que já fizemos</h3><div class="vit-fotos">${v.fotos.map((f,i)=>`<button type="button" onclick="verFoto('${f}')" aria-label="Ver foto ${i+1}"><img src="${f}" alt="" loading="lazy"/></button>`).join('')}</div></div>`;
  if((v.depoimentos||[]).length) h+=`<div class="vit-bloco"><h3 class="vit-tit">O que dizem nossos clientes</h3>${v.depoimentos.map(d=>`<figure class="vit-dep"><div class="vit-est">${'★'.repeat(d.nota||5)}</div><blockquote>“${esc(d.texto)}”</blockquote><figcaption>— ${esc(d.nome)} <span class="vit-verif">✓ cliente verificado</span></figcaption></figure>`).join('')}</div>`;
  if(q.status==='Aprovado') h+=`<div class="vit-bloco"><a class="vit-avaliar" href="/avaliar.html?t=${encodeURIComponent(token)}">⭐ Já fez o serviço? Avalie ${emp}</a></div>`;
  return h;
}
function verFoto(src){
  const f=document.createElement('div'); f.className='vit-zoom'; f.innerHTML=`<img src="${src}" alt=""/><button type="button" aria-label="Fechar">✕</button>`;
  f.onclick=()=>f.remove(); document.body.appendChild(f);
}

(async()=>{
  if(!token){document.getElementById('content').innerHTML='<div class="card"><p class="error">Link inválido.</p></div>';return;}

  let q;
  try{q=await api(`/api/public/quote/${encodeURIComponent(token)}`);}
  catch(e){document.getElementById('content').innerHTML=`<div style="padding:40px;text-align:center"><p class="error">${e.message}</p></div>`;return;}

  // Confirma visualização real (JS carregou)
  fetch(`/api/public/quote/${encodeURIComponent(token)}/view-confirmed`,{method:'POST',headers:{'Content-Type':'application/json'}}).catch(()=>{});

  Q=q;
  const final=['Aprovado','Recusado'].includes(q.status);
  if(q.usaItens) q.itens.forEach(i=>{ if(i.tipo==='recomendado'||(final&&i.escolhido)) escolhidos.add(String(i.id)); });
  const podeEscolher=!final && !q.expirado && q.pacotes.length>0;
  window.__temPacotes=podeEscolher;
  if(podeEscolher && q.pacotes.length===1) pacoteSel=q.pacotes[0].id;
  const pkgsHtml=q.pacotes.length?`
    <div style="margin-top:20px">
      <div style="font-size:var(--fs-sm);font-weight:700;color:#5B6675;margin-bottom:10px">${podeEscolher&&q.pacotes.length>1?'Escolha uma opção':'Opções de serviço'}</div>
      ${q.pacotes.map(p=>`
        <div class="pkg-card${p.destaque?' destaque':''}${(p.escolhido||(podeEscolher&&String(pacoteSel)===String(p.id)))?' pkg-escolhido':''}" data-id="${p.id}" ${podeEscolher?`onclick="escolherPacote(${p.id})" style="cursor:pointer"`:''}>
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
            <strong>${podeEscolher&&q.pacotes.length>1?'<span class="pkg-radio"></span>':''}${esc(p.nome)}</strong> ${p.escolhido?'<span class="pkg-badge">escolhido</span>':(p.destaque?'<span class="pkg-badge">mais escolhido</span>':'')}
          </div>
          ${p.conteudo?`<p style="font-size:var(--fs-md);color:#5B6675;margin-top:4px">${esc(p.conteudo)}</p>`:''}
          <div style="font-size:var(--fs-xl);font-weight:800;color:#0F3A8C;margin-top:6px">${brl(p.preco)}</div>
        </div>`).join('')}
    </div>`:'';

  const acaoHtml=final?`
    <div style="background:${q.status==='Aprovado'?'#D4FBDC':'#F2F2F7'};padding:20px;border-radius:12px;text-align:center;margin-top:20px">
      <p style="font-weight:700">${q.status==='Aprovado'?'<span style="color:var(--green)">'+ic('ok',18)+'</span> Aprovado':'<span style="color:var(--red)">'+ic('recusado',18)+'</span> Recusado'}</p>
    </div>`:
    q.expirado?`<div style="background:#FFE8D6;padding:16px;border-radius:12px;margin-top:20px"><p style="font-weight:600;color:#C04A00">⏰ Este orçamento está expirado. Entre em contato para renovar.</p></div>`:
    `<div id="acao-area" style="margin-top:20px">
      ${q.alteracao&&q.alteracao.pendente?`<div class="alt-aviso">${ic('nota',18)} <strong>Você pediu uma alteração</strong> em ${new Date(q.alteracao.em).toLocaleDateString('pt-BR')}: “${esc(q.alteracao.texto)}”<br>Quando a nova versão estiver pronta, este mesmo link é atualizado.</div>`:''}
      <textarea id="obs-acao" class="alt-texto" rows="2" placeholder="Comentário (opcional)"></textarea>
      <button class="btn-accept" style="width:100%" onclick="acao('aceitar')">✓ Aprovar orçamento</button>
      <div class="alt-sec">
        <button class="alt-btn" onclick="abrirPainel('alterar')">${ic('lapis',16)} Pedir alteração</button>
        <button class="alt-btn" onclick="abrirPainel('recusar')">Recusar</button>
      </div>
      <div id="painel"></div>
      <div id="confirmar-area"></div>
      <p id="msg-acao" class="error" style="margin-top:10px"></p>
    </div>`;

  document.getElementById('content').innerHTML=`
    <div class="quote-card">
      <div class="quote-header">
        ${marcaHtml(q.prestador)}
        <div style="font-size:var(--fs-sm);font-weight:700;opacity:.88;margin-bottom:6px">Orçamento</div>
        <h1>${esc(q.servico)}</h1>
        ${seloGoogle(q.vitrine)}
        <div style="font-size:var(--fs-md);opacity:.9">Para: ${esc(q.clienteNome)}</div>
      </div>
      <div class="quote-body">
        <div style="font-size:var(--fs-sm);color:#5B6675;font-weight:700;margin-bottom:4px">${q.usaItens?'Total':'Valor'}</div>
        <div class="valor-grande" id="total-vivo">${brl(q.usaItens&&q.aprovacao&&q.status==='Aprovado'?q.aprovacao.total/100:q.valor)}</div>
        ${validadeHtml(q,final)}
        ${q.observacoes?`<div style="background:#F2F2F7;border-radius:10px;padding:14px;margin-top:16px"><p style="font-size:var(--fs-md)">${esc(q.observacoes)}</p></div>`:''}
        ${q.usaItens?itensHtml(q,!final&&!q.expirado):''}
        ${pkgsHtml}
        ${vitrineHtml(q)}
        ${acaoHtml}
      </div>
    </div>
    ${q.usaItens&&!final&&!q.expirado?`<div id="barra-fixa" class="it-barra"><div><div class="it-barra-rot">Total</div><div class="it-barra-val" id="barra-total"></div><div class="it-barra-sinal" id="barra-sinal"></div></div><button class="btn-accept" onclick="document.getElementById('acao-area').scrollIntoView({behavior:'smooth'})">Aprovar</button></div>`:''}`;
  if(q.usaItens && !(q.aprovacao&&q.status==='Aprovado')) atualizarTotal();
  else if(q.usaItens) document.getElementById('resumo-itens').innerHTML=`<div class="it-res it-res-total"><span>Total aprovado</span><span>${VCalc.reais(q.aprovacao.total)}</span></div>`+(q.aprovacao.sinal?`<div class="it-res"><span>Sinal</span><span>${VCalc.reais(q.aprovacao.sinal)}</span></div>`:'');
})();
</script>
<style>
.selo-google{display:inline-flex;align-items:center;gap:4px;margin-top:10px;background:rgba(255,255,255,.14);border-radius:20px;padding:5px 12px;font-size:var(--fs-sm);color:#F5D77A;letter-spacing:.5px}
.selo-google b{color:#fff;letter-spacing:0}
.validade-cont{display:inline-flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:10px;background:#FFF6E0;color:#8A5A00;border-radius:10px;padding:8px 12px;font-size:var(--fs-sm)}
.validade-cont span{color:#A88A4A}
.vit-bloco{margin-top:24px}
.vit-tit{font-size:var(--fs-lg);margin:0 0 10px;color:#0F3A8C}
.vit-dif{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.vit-dif li{display:flex;gap:10px;align-items:flex-start;background:#F4F7FB;border-radius:12px;padding:12px 14px;font-weight:600;font-size:var(--fs-md)}
.vit-dif li span{width:24px;height:24px;flex-shrink:0;border-radius:50%;background:#1F8A55;color:#fff;display:grid;place-items:center;font-size:13px}
.vit-fotos{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}
.vit-fotos button{flex:0 0 44%;aspect-ratio:1;border:none;padding:0;border-radius:14px;overflow:hidden;scroll-snap-align:start;cursor:zoom-in;background:#EEF2F6}
.vit-fotos img{width:100%;height:100%;object-fit:cover;display:block}
.vit-dep{margin:0 0 10px;background:#fff;border:1.5px solid #E5E9F0;border-radius:14px;padding:14px 16px}
.vit-dep blockquote{margin:0;font-size:var(--fs-md);line-height:1.5;color:#1C1C1E}
.vit-dep figcaption{margin-top:6px;font-size:var(--fs-sm);color:#6B7280;font-weight:600}
.vit-est{color:#E4A72A;font-size:15px;letter-spacing:1px;margin-bottom:4px}
.vit-verif{color:#1F8A55;font-weight:700;font-size:12px;margin-left:6px}
.vit-avaliar{display:block;text-align:center;padding:14px;border-radius:14px;background:#FFF6E0;color:#8A5A00;font-weight:800;text-decoration:none}
.it-mini{flex-shrink:0;width:48px;height:48px;border-radius:10px;overflow:hidden;border:1px solid #E5E9F0;padding:0;background:#F4F6F9;cursor:zoom-in;align-self:flex-start}
.it-mini img{width:100%;height:100%;object-fit:cover;display:block}
.vit-zoom{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.9);display:grid;place-items:center;padding:16px}
.vit-zoom img{max-width:100%;max-height:90vh;border-radius:12px}
.vit-zoom button{position:absolute;top:16px;right:16px;width:44px;height:44px;border-radius:50%;border:none;background:#fff;font-size:20px;cursor:pointer}
</style>
</body></html>
