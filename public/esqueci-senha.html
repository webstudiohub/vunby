<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>VUNBY — Esqueci minha senha</title>
<link rel="stylesheet" href="style.css"/>
</head><body>
<div class="auth-container">
  <div class="auth-logo">VUN<span>BY</span></div>
  <div class="card">
    <h2>Recuperar senha</h2>
    <p class="muted" style="margin-bottom:16px;">Informe seu e-mail e enviaremos um link para redefinir sua senha.</p>
    <label>E-mail</label><input id="email" type="email" placeholder="seu@email.com"/>
    <div style="margin-top:18px;"><button class="btn-primary" onclick="enviar()">Enviar link</button></div>
    <div id="msg" class="error"></div>
    <div id="ok" class="success" style="display:none">Link enviado! Verifique seu e-mail.</div>
  </div>
  <p class="muted text-center mt"><a href="/entrar">← Voltar</a></p>
</div>
<script>
async function enviar(){
  const email=document.getElementById('email').value;
  const msg=document.getElementById('msg');
  msg.textContent='';
  try{
    const r=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||'Erro');
    document.getElementById('ok').style.display='block';
  }catch(e){msg.textContent=e.message;}
}
</script>
</body></html>
