<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>VUNBY — Esqueci minha senha</title>
<link rel="stylesheet" href="style.css"/>
<style>
body { background: var(--navy); padding-bottom: 0; }
.auth-outer { background: var(--navy); }
.auth-body { background: var(--gray); border-radius: 24px 24px 0 0; flex: 1; padding: var(--sp-6) var(--sp-5) 48px; }
</style>
</head><body>
<div class="auth-outer">
  <div class="auth-header">
    <div class="auth-logo">VUN<span>BY</span></div>
    <div class="auth-tagline">Recuperar acesso à conta</div>
  </div>
  <div class="auth-body">
    <p class="muted" style="margin-bottom:var(--sp-5);font-size:var(--fs-md);line-height:1.6;">
      Informe seu e-mail e enviaremos um link para redefinir sua senha.
    </p>
    <label style="margin-top:0">E-mail</label>
    <input id="email" type="email" placeholder="seu@email.com" autocomplete="email"/>
    <div style="margin-top:var(--sp-5)">
      <button class="btn-primary" onclick="enviar()">Enviar link de recuperação</button>
    </div>
    <div id="msg" class="error"></div>
    <div id="ok" class="success" style="display:none">Link enviado! Verifique seu e-mail.</div>
    <p class="text-center mt" style="font-size:var(--fs-sm)"><a href="/entrar">← Voltar ao login</a></p>
  </div>
</div>
<script>
async function enviar(){
  const email=document.getElementById('email').value;
  const msg=document.getElementById('msg');
  const btn=document.querySelector('.btn-primary');
  msg.textContent='';
  btn.disabled=true; btn.textContent='Enviando…';
  try{
    const r=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||'Erro');
    document.getElementById('ok').style.display='block';
    btn.textContent='Link enviado!';
  }catch(e){msg.textContent=e.message; btn.disabled=false; btn.textContent='Enviar link de recuperação';}
}
document.addEventListener('keydown',e=>{if(e.key==='Enter')enviar();});
</script>
</body></html>
