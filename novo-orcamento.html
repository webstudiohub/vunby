<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>VUNBY — Novo Orçamento</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#003D6B" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/favicon-32.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="top"></div>
  <div class="container">
    <div style="margin-bottom:16px;">
      <button class="btn-outline btn-sm" id="tab-rapido">Modo Rápido</button>
      <button class="btn-outline btn-sm" id="tab-completo">Orçamento Completo</button>
    </div>

    <!-- MODO RÁPIDO -->
    <div class="card" id="form-rapido">
      <h2>Novo Orçamento — Modo Rápido</h2>
      <p class="muted">Uma tela só. Sem cadastrar catálogo antes.</p>
      <label>Nome do cliente *</label>
      <input id="r-nome" />
      <label>Telefone/WhatsApp *</label>
      <input id="r-telefone" placeholder="11987654321" />
      <label>Serviço *</label>
      <input id="r-servico" />
      <label>Valor total (R$) *</label>
      <input id="r-valor" type="number" step="0.01" />
      <label>Observação (opcional)</label>
      <textarea id="r-obs" rows="2"></textarea>
      <label>Pacote de venda (opcional)</label>
      <select id="r-pacote"><option value="">Nenhum</option></select>
      <div style="margin-top:16px;">
        <button id="btn-gerar-rapido" class="btn-primary" onclick="criarRapido()">Gerar orçamento</button>
      </div>
      <div id="r-resultado"></div>
      <div id="r-msg" class="error"></div>
    </div>

    <!-- COMPLETO -->
    <div class="card" id="form-completo" style="display:none;">
      <h2>Novo Orçamento — Completo</h2>
      <label>Nome do cliente *</label>
      <input id="c-nome" />
      <label>Telefone/WhatsApp *</label>
      <input id="c-telefone" />
      <label>Validade</label>
      <input id="c-validade" type="date" />
      <label>Observações</label>
      <textarea id="c-obs" rows="2"></textarea>
      <label>Condições</label>
      <input id="c-condicoes" />

      <h3>Itens</h3>
      <div id="itens-lista"></div>
      <button class="btn-outline btn-sm" onclick="addItem()">+ Adicionar item</button>

      <h3>Pacotes oferecidos ao cliente (opcional)</h3>
      <div id="pacotes-checkboxes"></div>

      <div style="margin-top:16px;">
        <button id="btn-gerar-completo" class="btn-primary" onclick="criarCompleto()">Gerar orçamento</button>
      </div>
      <div id="c-resultado"></div>
      <div id="c-msg" class="error"></div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    let packageTemplates = [];

    function showTab(which) {
      document.getElementById('form-rapido').style.display = which === 'rapido' ? 'block' : 'none';
      document.getElementById('form-completo').style.display = which === 'completo' ? 'block' : 'none';
    }
    document.getElementById('tab-rapido').onclick = () => showTab('rapido');
    document.getElementById('tab-completo').onclick = () => showTab('completo');

    function addItem() {
      const div = document.createElement('div');
      div.style.cssText = 'display:flex;gap:8px;margin-bottom:8px;align-items:flex-end;';
      div.innerHTML = `
        <div style="flex:2"><label>Descrição</label><input class="it-desc" /></div>
        <div style="flex:1"><label>Qtd.</label><input class="it-qtd" type="number" value="1" /></div>
        <div style="flex:1"><label>Valor unit. (R$)</label><input class="it-valor" type="number" step="0.01" /></div>
      `;
      document.getElementById('itens-lista').appendChild(div);
    }

    async function criarRapido() {
      const body = {
        clienteNome: document.getElementById('r-nome').value,
        clienteTelefone: document.getElementById('r-telefone').value,
        servico: document.getElementById('r-servico').value,
        valor: document.getElementById('r-valor').value,
        observacao: document.getElementById('r-obs').value,
        packageTemplateId: document.getElementById('r-pacote').value || null,
      };
      try {
        const res = await api('/api/quotes/rapido', { method: 'POST', body });
        document.getElementById('r-msg').textContent = '';
        document.getElementById('r-resultado').innerHTML = `
          <div class="success-msg">Orçamento gerado!</div>
          <p><a href="${res.link}" target="_blank">Abrir página do orçamento</a></p>
          <a class="btn btn-secondary btn-sm" href="${res.whatsappLink}" target="_blank">Abrir WhatsApp com mensagem pronta</a>
        `;
      } catch (e) {
        document.getElementById('r-msg').textContent = e.message;
      }
    }

    async function criarCompleto() {
      const itens = Array.from(document.querySelectorAll('#itens-lista > div')).map((div) => ({
        descricao: div.querySelector('.it-desc').value,
        quantidade: div.querySelector('.it-qtd').value,
        valorUnitario: div.querySelector('.it-valor').value,
      }));
      const packageTemplateIds = Array.from(document.querySelectorAll('.pkg-check:checked')).map((c) => c.value);
      const body = {
        clienteNome: document.getElementById('c-nome').value,
        clienteTelefone: document.getElementById('c-telefone').value,
        validade: document.getElementById('c-validade').value || null,
        observacoes: document.getElementById('c-obs').value,
        condicoes: document.getElementById('c-condicoes').value,
        itens,
        packageTemplateIds,
      };
      try {
        const res = await api('/api/quotes/completo', { method: 'POST', body });
        document.getElementById('c-msg').textContent = '';
        document.getElementById('c-resultado').innerHTML = `
          <div class="success-msg">Orçamento gerado!</div>
          <p><a href="${res.link}" target="_blank">Abrir página do orçamento</a></p>
        `;
      } catch (e) {
        document.getElementById('c-msg').textContent = e.message;
      }
    }

    (async () => {
      const session = await requireSession();
      if (!session) return;
      document.getElementById('top').innerHTML = topbar('novo-orcamento.html');
      wireLogout();
      showTab('rapido');
      addItem();

      packageTemplates = await api('/api/packages');
      const select = document.getElementById('r-pacote');
      const checks = document.getElementById('pacotes-checkboxes');
      packageTemplates.forEach((p) => {
        select.innerHTML += `<option value="${p.id}">${esc(p.nome)} — ${brl(p.preco)}</option>`;
        checks.innerHTML += `<label style="display:flex;align-items:center;gap:6px;font-weight:400;">
          <input type="checkbox" class="pkg-check" value="${p.id}" style="width:auto;" /> ${esc(p.nome)} — ${brl(p.preco)}
        </label>`;
      });
      if (packageTemplates.length === 0) {
        checks.innerHTML = '<p class="muted">Nenhum modelo de pacote cadastrado ainda. Crie em "Pacotes".</p>';
      }
    })();
  </script>
</body>
</html>
