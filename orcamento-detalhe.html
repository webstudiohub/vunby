<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>VUNBY — Orçamento</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#003D6B" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/favicon-32.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="top"></div>
  <div class="container" id="conteudo">Carregando…</div>

  <script src="app.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get('id');

    async function registrarFollowUp() {
      const mensagem = document.getElementById('fu-mensagem').value;
      const res = await api(`/api/quotes/${id}/followups`, { method: 'POST', body: { mensagem } });
      document.getElementById('fu-mensagem').value = '';
      if (res.whatsappLink) window.open(res.whatsappLink, '_blank');
      renderPage();
    }

    /**
     * Passo 2 do fluxo de follow-up: depois de abrir o WhatsApp, o
     * prestador confirma manualmente que enviou. A VUNBY NUNCA afirma
     * entrega ou leitura — só que o próprio usuário confirmou o envio.
     */
    async function confirmarEnvio(followUpId) {
      await api(`/api/quotes/${id}/followups/${followUpId}/confirmar`, { method: 'POST' });
      renderPage();
    }

    async function renderPage() {
      const q = await api(`/api/quotes/${id}`);
      const el = document.getElementById('conteudo');

      const pacotesHtml = q.pacotes.length
        ? `<div class="card"><h3>Pacotes oferecidos</h3>${q.pacotes
            .map((p) => `<p>${esc(p.nome)} — ${brl(p.preco)} ${q.quotePackageId === p.id ? '<strong>(escolhido)</strong>' : ''}</p>`)
            .join('')}</div>`
        : '';

      const followUpsHtml = q.followUps.length === 0
        ? '<p class="muted">Nenhum follow-up registrado ainda.</p>'
        : q.followUps
            .map((f) => {
              const data = new Date(f.createdAt).toLocaleString('pt-BR');
              if (f.estado === 'preparado') {
                return `<div style="margin-bottom:8px;">
                  <p class="muted" style="margin-bottom:4px;">${data} — ${esc(f.mensagem)}</p>
                  <button class="btn-outline btn-sm" onclick="confirmarEnvio(${f.id})">Confirmar que enviei pelo WhatsApp</button>
                </div>`;
              }
              return `<p class="muted">${data} — ${esc(f.mensagem)} <em>(enviado — confirmado pelo usuário)</em></p>`;
            })
            .join('');

      el.innerHTML = `
        <div class="card">
          <h2>${esc(q.servico)} <span class="${badgeClass(q.status)}">${q.status}</span> ${q.precisaFollowUp ? '<span class="flag-followup">precisa de follow-up</span>' : ''}</h2>
          <p><strong>Cliente:</strong> ${esc(q.cliente.nome)} — ${esc(q.cliente.telefone)}</p>
          <p><strong>Valor:</strong> ${brl(q.valor)} ${q.validade ? `— <strong>Validade:</strong> ${esc(q.validade)}${q.expirado ? ' (vencido)' : ''}` : ''}</p>
          ${q.observacoes ? `<p><strong>Observações:</strong> ${esc(q.observacoes)}</p>` : ''}
          <p><a href="/orcamento.html?token=${encodeURIComponent(q.publicToken)}" target="_blank">Ver página pública do cliente</a></p>
        </div>

        ${pacotesHtml}

        <div class="card">
          <h3>Registrar novo follow-up</h3>
          <p class="muted">Passo 1: prepare a mensagem e abra o WhatsApp. Passo 2: depois de enviar de verdade, volte aqui e confirme — a VUNBY não sabe sozinha se a mensagem foi entregue ou lida.</p>
          <textarea id="fu-mensagem" rows="2" placeholder="Mensagem (opcional — usamos uma padrão se deixar em branco)"></textarea>
          <div style="margin-top:10px;">
            <button class="btn-primary" onclick="registrarFollowUp()">1. Preparar e abrir WhatsApp</button>
          </div>
        </div>

        <div class="card">
          <h3>Histórico de follow-ups (${q.followUps.length})</h3>
          ${followUpsHtml}
        </div>
      `;
    }

    (async () => {
      const session = await requireSession();
      if (!session) return;
      document.getElementById('top').innerHTML = topbar('');
      wireLogout();
      renderPage();
    })();
  </script>
</body>
</html>
