<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>VUNBY — Verificar telefone</title>
<link rel="stylesheet" href="style.css"/>
</head><body>
<div class="auth-container">
  <div class="auth-logo">VUN<span>BY</span></div>
  <div class="card">
    <h2 style="text-align:center;margin-bottom:8px;">Verificar telefone</h2>
    <p class="muted text-center" style="margin-bottom:20px;">Digite o código de 6 dígitos enviado por WhatsApp/SMS.</p>
    <label>Código</label>
    <input id="code" type="number" maxlength="6" placeholder="000000" inputmode="numeric" style="text-align:center;font-size:28px;font-weight:800;letter-spacing:.15em"/>
    <div style="margin-top:18px;"><button class="btn-primary" onclick="verificar()">Verificar</button></div>
    <div id="msg" class="error"></div>
  </div>
</div>
<script>
const params=new URLSearchParams(location.search);
const email=params.get('email')||'';
async function verificar(){
  const code=document.getElementById('code').value;
  const msg=document.getElementById('msg');
  msg.textContent='';
  try{
    const r=await fetch('/api/auth/verify-phone',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,code})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||'Erro');
    location.href='/entrar';
  }catch(e){msg.textContent=e.message;}
}
</script>
</body></html>
