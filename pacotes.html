<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>VUNBY — Pacotes de Venda</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#003D6B" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/favicon-32.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="top"></div>
  <div class="container">
    <h2>Modelos de Pacote de Venda</h2>
    <p class="muted">Crie uma vez, use em vários orçamentos. Editar aqui não muda orçamentos já enviados.</p>

    <div class="card">
      <h3>Novo modelo</h3>
      <label>Nome (ex: Básico, Completo, Premium)</label>
      <input id="p-nome" />
      <label>Descrição / itens incluídos</label>
      <textarea id="p-conteudo" rows="2"></textarea>
      <label>Preço (R$)</label>
      <input id="p-preco" type="number" step="0.01" />
      <label style="display:flex;align-items:center;gap:6px;">
        <input type="checkbox" id="p-destaque" style="width:auto;" /> Marcar como "mais escolhido"
      </label>
      <div style="margin-top:12px;">
        <button class="btn-primary" onclick="criarPacote()">Salvar modelo</button>
      </div>
      <div id="msg" class="error"></div>
    </div>

    <div class="card">
      <h3>Meus modelos</h3>
      <div id="lista" class="grid"></div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    async function criarPacote() {
      const body = {
        nome: document.getElementById('p-nome').value,
        conteudo: document.getElementById('p-conteudo').value,
        preco: document.getElementById('p-preco').value,
        destaque: document.getElementById('p-destaque').checked,
      };
      try {
        await api('/api/packages', { method: 'POST', body });
        window.location.reload();
      } catch (e) {
        document.getElementById('msg').textContent = e.message;
      }
    }

    (async () => {
      const session = await requireSession();
      if (!session) return;
      document.getElementById('top').innerHTML = topbar('pacotes.html');
      wireLogout();

      const pacotes = await api('/api/packages');
      const lista = document.getElementById('lista');
      if (pacotes.length === 0) lista.innerHTML = '<p class="muted">Nenhum modelo ainda.</p>';
      pacotes.forEach((p) => {
        lista.innerHTML += `<div class="card">
          <strong>${esc(p.nome)}</strong> ${p.destaque ? '<span class="flag-followup">mais escolhido</span>' : ''}
          <p class="muted">${esc(p.conteudo || '')}</p>
          <div style="font-size:18px;font-weight:800;color:var(--navy)">${brl(p.preco)}</div>
        </div>`;
      });
    })();
  </script>
</body>
</html>
