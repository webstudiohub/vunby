<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>VUNBY — Início</title>
<link rel="manifest" href="manifest.json"/><meta name="theme-color" content="#003D6B"/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
<link rel="stylesheet" href="style.css"/>
<style>
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.stat-card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 12px rgba(0,0,0,.07)}
.stat-label{font-size:12px;font-weight:700;color:#8E8E93;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.stat-value{font-size:26px;font-weight:800;color:#003D6B}
.stat-value.gold{color:#B8860B}
</style>
</head><body>
<div id="top"></div>
<div class="container">
  <div id="stats-area"><p class="muted">Carregando…</p></div>
  <div style="display:flex;gap:10px;margin-bottom:16px">
    <a href="novo-orcamento.html" style="flex:1"><button class="btn-primary btn-gold">+ Novo Orçamento</button></a>
    <a href="radar.html" style="flex:1"><button class="btn-outline">Radar 🎯</button></a>
  </div>
  <div class="card" id="recent-area"><h3>Orçamentos recentes</h3><div id="recent-list"><p class="muted">Carregando…</p></div></div>
</div>
<script src="app.js"></script>
<script>
(async()=>{
  const session=await requireSession();if(!session)return;
  document.getElementById('top').innerHTML=topbar('dashboard.html');wireLogout();

  const [dash,quotes]=await Promise.all([api('/api/dashboard'),api('/api/quotes')]);

  const s=dash.stats||{};
  const env=s['Enviado']||{count:0};
  const vis=s['Visualizado']||{count:0};
  const apr=s['Aprovado']||{count:0,total:0};

  document.getElementById('stats-area').innerHTML=`
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Valor em aberto</div><div class="stat-value">${brl(dash.valorEmAberto)}</div></div>
      <div class="stat-card"><div class="stat-label">Follow-ups pendentes</div><div class="stat-value gold">${dash.pendentesFollowUp}</div></div>
      <div class="stat-card"><div class="stat-label">Visualizados</div><div class="stat-value">${vis.count}</div></div>
      <div class="stat-card"><div class="stat-label">Aprovados</div><div class="stat-value" style="color:#34C759">${apr.count}</div></div>
    </div>`;

  const recentes=quotes.slice(0,5);
  if(!recentes.length){document.getElementById('recent-list').innerHTML='<p class="muted">Nenhum orçamento ainda. Crie o primeiro!</p>';return;}
  document.getElementById('recent-list').innerHTML=recentes.map(q=>`
    <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #F2F2F7">
      <div>
        <a href="orcamento-detalhe.html?id=${q.id}" style="font-weight:700;color:#003D6B;text-decoration:none">${esc(q.servico)}</a>
        <div class="muted" style="font-size:13px">${esc(q.cliente_nome)} · ${relDate(q.created_at)}</div>
      </div>
      <div style="text-align:right">
        <div style="font-weight:800">${brl(q.valor)}</div>
        <span class="${badgeClass(q.status)}">${q.status}</span>
      </div>
    </div>`).join('');
})();
</script>
</body></html>
