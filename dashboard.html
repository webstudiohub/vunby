<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>VUNBY — Dashboard</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#003D6B" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/favicon-32.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="top"></div>
  <div class="container">
    <div id="banner-telefone"></div>
    <h2>Olá! Aqui está o resumo do seu negócio.</h2>

    <div class="grid">
      <div class="card metric">
        <div class="value" id="m-aberto">—</div>
        <div class="label">Valor em aberto (Enviado + Visualizado + Sem resposta)</div>
      </div>
      <div class="card metric">
        <div class="value" id="m-faturamento">—</div>
        <div class="label">Faturamento do mês (Aprovados)</div>
      </div>
      <div class="card metric">
        <div class="value" id="m-total">—</div>
        <div class="label">Total de orçamentos</div>
      </div>
    </div>

    <div class="card">
      <h3>Status dos orçamentos</h3>
      <div id="status-counts" class="grid"></div>
    </div>

    <div class="card">
      <h3>Orçamentos recentes</h3>
      <div class="table-scroll"><table>
        <thead><tr><th>Cliente</th><th>Serviço</th><th>Valor</th><th>Status</th><th></th></tr></thead>
        <tbody id="recentes"></tbody>
      </table></div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    (async () => {
      const session = await requireSession();
      if (!session) return;
      document.getElementById('top').innerHTML = topbar('dashboard.html');
      wireLogout();

      if (!session.telefoneVerificado) {
        document.getElementById('banner-telefone').innerHTML = `
          <div class="card" style="border-color:#F5C000;background:#FFF9E6;">
            Verifique seu telefone para confirmar o benefício de teste grátis.
            <a href="verificar-telefone.html"><strong>Verificar agora</strong></a>
          </div>`;
      }

      const d = await api('/api/dashboard');
      document.getElementById('m-aberto').textContent = brl(d.valorEmAberto);
      document.getElementById('m-faturamento').textContent = brl(d.faturamentoMes);
      document.getElementById('m-total').textContent = d.totalOrcamentos;

      const statusEl = document.getElementById('status-counts');
      Object.entries(d.contagemPorStatus).forEach(([status, count]) => {
        statusEl.innerHTML += `<div><span class="${badgeClass(status)}">${status}</span> <strong>${count}</strong></div>`;
      });

      const body = document.getElementById('recentes');
      d.recentes.forEach((q) => {
        body.innerHTML += `<tr>
          <td>${esc(q.clienteNome)}</td>
          <td>${esc(q.servico)}</td>
          <td>${brl(q.valor)}</td>
          <td><span class="${badgeClass(q.status)}">${q.status}</span>${q.precisaFollowUp ? '<span class="flag-followup">follow-up</span>' : ''}</td>
          <td><a href="orcamento-detalhe.html?id=${q.id}">ver</a></td>
        </tr>`;
      });
    })();
  </script>
</body>
</html>
