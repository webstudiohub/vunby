<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>VUNBY — Redefinir senha</title>
<link rel="stylesheet" href="style.css" />
<link rel="icon" href="icons/favicon-32.png" />
</head>
<body>
  <div class="center-page">
    <div class="card">
      <div class="logo-mark">VUNBY<span class="dot">.</span></div>
      <h3>Redefinir senha</h3>
      <label>Nova senha (mínimo 6 caracteres)</label>
      <input type="password" id="novaSenha" />
      <div style="margin-top:14px;">
        <button class="btn-primary" onclick="redefinir()">Salvar nova senha</button>
      </div>
      <p id="msg" class="muted" style="margin-top:12px;"></p>
    </div>
  </div>

  <script>
    const token = new URLSearchParams(location.search).get('token');

    async function redefinir() {
      const novaSenha = document.getElementById('novaSenha').value;
      const msg = document.getElementById('msg');
      try {
        const res = await fetch('/api/auth/redefinir-senha', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, novaSenha }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        msg.className = 'success-msg';
        msg.textContent = 'Senha redefinida! Você já pode entrar com a nova senha.';
        setTimeout(() => (window.location.href = '/index.html'), 1500);
      } catch (e) {
        msg.className = 'error';
        msg.textContent = e.message;
      }
    }

    if (!token) {
      document.getElementById('msg').className = 'error';
      document.getElementById('msg').textContent = 'Link inválido — falta o token de redefinição.';
    }
  </script>
</body>
</html>
